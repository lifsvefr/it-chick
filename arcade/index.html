<style>
/* ---------- landing: two 2×2 grids of game cards ---------- */
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ahead h1{margin:0;font-size:1.6em}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 8px}
.sh h2{margin:0;font-size:1.08em}
.arc{display:grid;gap:14px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* ---------- arcade skin: lit sign, wooden cabinets, game screens; one palette per display mode ---------- */
:root{--pixel:"Silkscreen","JetBrains Mono",ui-monospace,monospace;
  /* light: honey-wood cabinets, cream screens, deep-ink "glows" */
  --cab:#a87650;--cabDk:#7f5536;--cabInk:#fffaf2;--cabSoft:#f6e6cf;
  --scr:#fbf5ea;--scr2:#f3e9d8;--scrLine:#dccab0;--scrInk:#2e1d15;--scrSoft:#6b5444;--scrDot:rgba(122,82,54,.22);--scrDot2:rgba(31,90,92,.2);--scan:rgba(46,29,21,.035);--vig:rgba(122,82,54,.12);
  --gY:#7d6012;--gT:#1f5a5c;--gR:#a24a28;--gG:#3d5c3e;--gP:#7a2d3a;--glowY:none;--glowT:none;--glowP:none;
  --mY:#efcd6e;--mT:#94d0cc;--mR:#f2a881;--mG:#b8d7ad;--mInk:#2e1d15;
  --bulb:#d9a92e;--signBg:#fffaf2;--signInk:#a24a28;--signGlow:0 2px 0 #efcd6e;
  --cdBg:rgba(251,245,234,.86);--popBg:rgba(255,250,242,.92);--hiRow:rgba(125,96,18,.1);
  --c-bg:#fbf5ea;--c-panel:#fffaf2;--c-panel2:#efe5d4;--c-ink:#2e1d15;--c-soft:#6b5444;--c-line:#dccab0;--c-rose:#a24a28;--c-lup:#1f5a5c;--c-gold:#7d6012;--c-sage:#3d5c3e;--c-roseT:#f6e2d8;--c-lupT:#dcecea;--c-goldT:#f3e8c8;--c-sageT:#e1eadc;--c-ok:#3d6a35;--c-okT:#e1edd8;--c-bad:#7a2d3a;--c-badT:#f3dfe2;--c-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cab:#5a3a2a;--cabDk:#3e271c;--cabInk:#f1e6d6;--cabSoft:#e9d9c2;
  --scr:#120d0b;--scr2:#17100c;--scrLine:#4a372c;--scrInk:#f1e6d6;--scrSoft:#cdb89c;--scrDot:rgba(241,230,214,.55);--scrDot2:rgba(124,196,194,.5);--scan:rgba(255,255,255,.03);--vig:rgba(0,0,0,.45);
  --gY:#f2cf6b;--gT:#7cc4c2;--gR:#f09a70;--gG:#a3c79a;--gP:#e3939f;--glowY:0 0 10px rgba(242,207,107,.6);--glowT:0 0 10px rgba(124,196,194,.6);--glowP:0 0 8px rgba(227,147,159,.6);
  --mY:#f2cf6b;--mT:#7cc4c2;--mR:#f09a70;--mG:#a3c79a;--mInk:#1a1310;
  --bulb:#f2cf6b;--signBg:#1a1310;--signInk:#f2cf6b;--signGlow:0 0 10px rgba(242,207,107,.6);
  --cdBg:rgba(13,9,7,.78);--popBg:rgba(13,9,7,.8);--hiRow:rgba(242,207,107,.09);
  --c-bg:#120d0b;--c-panel:#1f1612;--c-panel2:#2a1e18;--c-ink:#f1e6d6;--c-soft:#cdb89c;--c-line:#4a372c;--c-rose:#f09a70;--c-lup:#7cc4c2;--c-gold:#f2cf6b;--c-sage:#a3c79a;--c-roseT:#3d2419;--c-lupT:#1b3332;--c-goldT:#3a2f17;--c-sageT:#23301f;--c-ok:#a9d494;--c-okT:#25331f;--c-bad:#e3939f;--c-badT:#3e2328;--c-scheme:dark}}
:root[data-theme="dark"]{
  --cab:#5a3a2a;--cabDk:#3e271c;--cabInk:#f1e6d6;--cabSoft:#e9d9c2;
  --scr:#120d0b;--scr2:#17100c;--scrLine:#4a372c;--scrInk:#f1e6d6;--scrSoft:#cdb89c;--scrDot:rgba(241,230,214,.55);--scrDot2:rgba(124,196,194,.5);--scan:rgba(255,255,255,.03);--vig:rgba(0,0,0,.45);
  --gY:#f2cf6b;--gT:#7cc4c2;--gR:#f09a70;--gG:#a3c79a;--gP:#e3939f;--glowY:0 0 10px rgba(242,207,107,.6);--glowT:0 0 10px rgba(124,196,194,.6);--glowP:0 0 8px rgba(227,147,159,.6);
  --mY:#f2cf6b;--mT:#7cc4c2;--mR:#f09a70;--mG:#a3c79a;--mInk:#1a1310;
  --bulb:#f2cf6b;--signBg:#1a1310;--signInk:#f2cf6b;--signGlow:0 0 10px rgba(242,207,107,.6);
  --cdBg:rgba(13,9,7,.78);--popBg:rgba(13,9,7,.8);--hiRow:rgba(242,207,107,.09);
  --c-bg:#120d0b;--c-panel:#1f1612;--c-panel2:#2a1e18;--c-ink:#f1e6d6;--c-soft:#cdb89c;--c-line:#4a372c;--c-rose:#f09a70;--c-lup:#7cc4c2;--c-gold:#f2cf6b;--c-sage:#a3c79a;--c-roseT:#3d2419;--c-lupT:#1b3332;--c-goldT:#3a2f17;--c-sageT:#23301f;--c-ok:#a9d494;--c-okT:#25331f;--c-bad:#e3939f;--c-badT:#3e2328;--c-scheme:dark}
.sign{position:relative;background:var(--signBg);border:4px solid var(--cab);border-radius:16px;padding:8px 14px;display:grid;gap:6px;justify-items:center;text-align:center;overflow:hidden}
.sign::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px);pointer-events:none}
.sign h1{margin:4px 0;font-family:var(--pixel);font-weight:700;font-size:clamp(20px,6.4vw,30px);letter-spacing:.06em;color:var(--signInk);text-shadow:var(--signGlow);animation:neon 2.6s infinite}
.bulbs{justify-self:stretch;height:10px;background:radial-gradient(circle,var(--bulb) 2.5px,transparent 3.5px) 0 50%/16px 10px repeat-x;animation:chase .5s steps(1) infinite;filter:drop-shadow(0 0 3px var(--bulb))}
.bulbs.alt{animation-delay:.25s}
@keyframes chase{50%{background-position:8px 50%}}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.5}}
.ctlrow{display:flex;justify-content:flex-end;gap:8px;margin-bottom:-6px}
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;border:2px dashed var(--gold);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.today .tl{font-family:var(--pixel);font-weight:700;font-size:15px;letter-spacing:.05em;color:var(--gold)}
.today .td{font-size:.88em;color:var(--soft);grid-column:1}
.today .tm{font-family:var(--pixel);font-size:11.5px;color:var(--soft);grid-column:1;letter-spacing:.03em}
.today .tm b{color:var(--rose);font-weight:700}
.today .go{grid-row:1 / span 3;grid-column:2;font-family:var(--pixel);font-weight:700;font-size:14px;background:var(--gold);color:var(--bg);padding:10px 12px;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.today:hover .go,.today:focus-visible .go{filter:brightness(1.12)}
.today:active{transform:translateY(2px)}
.gc{--glow:var(--mR);-webkit-user-select:none;user-select:none;position:relative;display:grid;grid-template-rows:auto auto auto 1fr;text-align:left;padding:0 0 8px;overflow:hidden;border-radius:14px 14px 10px 10px;border:0;background:var(--cab);color:var(--cabInk);font:inherit;cursor:pointer;text-decoration:none;box-shadow:0 5px 0 var(--cabDk);transition:transform .08s,box-shadow .08s;min-width:0;-webkit-tap-highlight-color:transparent}
.gc:hover,.gc:focus-visible{transform:translateY(-2px);box-shadow:0 7px 0 var(--cabDk)}
.gc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cabDk)}
.gc:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.gc .mq{margin:6px 6px 0;padding:5px 4px;text-align:center;font-family:var(--pixel);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--mInk);background:var(--glow);box-shadow:0 0 12px color-mix(in srgb,var(--glow) 55%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .art{--acc:var(--ink2);--accT:var(--scr2);--panel:var(--scr2);--panel2:var(--scr2);--ink:var(--scrInk);--soft:var(--scrSoft);--line:var(--scrLine);--gold:var(--gY);--rose:var(--gR);--ok:var(--gG);--okTint:var(--scr);position:relative;display:block;margin:5px 6px 0;height:72px;background:var(--scr2);overflow:hidden;border:0}
.gc .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px);pointer-events:none}
.gc .hs{margin:6px 8px 0;font-family:var(--pixel);font-size:10.5px;line-height:1.35;color:var(--cabSoft);display:grid;letter-spacing:.03em}
.gc .hs em{font-style:normal;color:var(--cabInk);font-weight:700;overflow-wrap:anywhere}
.gc .sub{font-size:.74em;color:var(--cabSoft);padding:3px 8px 0;line-height:1.3}
.gc .sub b{color:var(--cabInk);font-family:var(--mono);font-weight:600}
.gc .pl{display:none}
.a1{--glow:var(--mR);--ink2:var(--gR)}.a2{--glow:var(--mT);--ink2:var(--gT)}.a3{--glow:var(--mY);--ink2:var(--gY)}.a4{--glow:var(--mG);--ink2:var(--gG)}
.gc svg .A{fill:var(--acc)} .gc svg .P{fill:var(--panel)} .gc svg .K{fill:var(--ink)} .gc svg .G{fill:var(--gold)} .gc svg .R{fill:var(--rose)}
.gc svg .S{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gc svg .O{fill:var(--panel);stroke:var(--acc);stroke-width:2.5}
/* the game screen: app colours for this display mode, scoped to the screen */
.crt{--bg:var(--c-bg);--panel:var(--c-panel);--panel2:var(--c-panel2);--ink:var(--c-ink);--soft:var(--c-soft);--line:var(--c-line);--rose:var(--c-rose);--lupine:var(--c-lup);--gold:var(--c-gold);--sage:var(--c-sage);--roseTint:var(--c-roseT);--lupTint:var(--c-lupT);--goldTint:var(--c-goldT);--sageTint:var(--c-sageT);--ok:var(--c-ok);--okTint:var(--c-okT);--bad:var(--c-bad);--badTint:var(--c-badT);
  color-scheme:var(--c-scheme);position:relative;color:var(--ink);border:4px solid var(--cab);border-radius:16px;padding:12px;overflow:hidden;min-height:62vh;display:grid;align-content:start;gap:12px;
  background-color:var(--scr);background-image:radial-gradient(var(--scrDot) 1px,transparent 1.5px),radial-gradient(var(--scrDot2) 1px,transparent 1.5px);background-size:46px 46px,73px 73px;background-position:0 0,20px 30px;animation:stars 4s linear infinite}
.crt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,var(--vig));pointer-events:none;z-index:0}
.crt>*{position:relative;z-index:1}
.crt a{color:var(--lupine)}
@keyframes stars{to{background-position:0 46px,20px 103px}}
.crt .hud{background:var(--scr2);border:2px solid var(--line);border-radius:0;font-family:var(--pixel);font-weight:400;letter-spacing:.04em;font-size:.82em}
.crt .hud #sc{font-size:1.45em;color:var(--gY);text-shadow:var(--glowY)}
.crt .timer{font-size:1.6em}.crt .timer.low{color:var(--gR);animation:blink .5s steps(1) infinite}
.hiline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--pixel);font-size:11.5px;letter-spacing:.04em;color:var(--soft)}
.hiline b{color:var(--gP);font-weight:400}
.crt .combo{font-family:var(--pixel);font-weight:700;color:var(--gT);text-shadow:var(--glowT)}
.crt .ready{color:var(--soft)}
.crt .stage,.crt .card{background:var(--panel);border:2px solid var(--line);border-radius:4px}
.crt .choice,.crt .opt,.crt .pc{border-radius:4px}
.crt .tbar{border-radius:0;background:var(--scr2)}.crt .tbar i{border-radius:0;background:repeating-linear-gradient(90deg,var(--gG) 0 8px,color-mix(in srgb,var(--gG) 70%,var(--scr)) 8px 10px)}
@keyframes blink{50%{opacity:0}}
/* effects */
.fx-shake{animation:fx-shake .45s cubic-bezier(.36,.07,.19,.97),stars 4s linear infinite}
@keyframes fx-shake{10%,90%{transform:translate(-2px,1px) rotate(-.4deg)}20%,80%{transform:translate(5px,-2px) rotate(.8deg)}30%,50%,70%{transform:translate(-8px,3px) rotate(-1.2deg)}40%,60%{transform:translate(8px,-3px) rotate(1.2deg)}}
.fx-red::after,.fx-white::after{content:"";position:absolute;inset:0;opacity:0;pointer-events:none;z-index:5;animation:fx-fl .35s}
.fx-red::after{background:#c0392b}.fx-white::after{background:#fff}
@keyframes fx-fl{0%{opacity:.5}100%{opacity:0}}
.fx-jelly{animation:fx-jelly .5s}
@keyframes fx-jelly{30%{transform:scale(1.12,.88)}50%{transform:scale(.93,1.08)}70%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
.fx-pix{position:absolute;width:8px;height:8px;z-index:6;pointer-events:none;animation:fx-burst .8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fx-burst{60%{opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 40px));opacity:0}}
.fx-pop{position:absolute;z-index:7;transform:translateX(-50%);font-family:var(--pixel);font-weight:700;font-size:17px;color:var(--gY);text-shadow:2px 2px 0 color-mix(in srgb,var(--gR) 60%,transparent);background:var(--popBg);padding:2px 6px;pointer-events:none;animation:fx-rise 1s ease-out forwards;white-space:nowrap}
@keyframes fx-rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-48px)}}
.fx-slam{position:absolute;left:50%;top:40%;z-index:8;font-family:var(--pixel);font-weight:700;font-size:clamp(26px,8vw,38px);white-space:nowrap;color:var(--gY);text-shadow:3px 3px 0 var(--gR),var(--glowY);pointer-events:none;animation:fx-slam .9s ease-out forwards}
@keyframes fx-slam{0%{transform:translate(-50%,-50%) scale(3) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(.9) rotate(4deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1.06) rotate(-2deg)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.fx-cd{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--cdBg)}
.fx-cd b{font-family:var(--pixel);font-weight:700;font-size:72px;color:var(--gT);text-shadow:4px 4px 0 color-mix(in srgb,var(--gT) 35%,transparent);animation:fx-cd .45s ease-out}
@keyframes fx-cd{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.fx-roll{color:var(--ink)!important}
/* results */
.res{justify-items:center;text-align:center;min-height:0}
.res .rt{font-family:var(--pixel);font-size:13px;letter-spacing:.08em;color:var(--soft)}
.newhi{font-family:var(--pixel);font-weight:700;font-size:20px;color:var(--gY);text-shadow:var(--glowY);animation:blink .8s steps(1) infinite}
.grow{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
.grade{width:78px;height:78px;border:3px solid var(--gT);display:grid;place-items:center;font-family:var(--pixel);font-weight:700;font-size:46px;color:var(--gT);text-shadow:var(--glowT);animation:fx-jelly .8s .2s}
.final{text-align:left;font-family:var(--pixel);font-size:12px;color:var(--soft);display:grid;gap:2px;letter-spacing:.03em}
.final b{font-size:26px;color:var(--gY);font-weight:700}
.nm label{display:block;font-family:var(--pixel);font-size:12px;color:var(--soft);letter-spacing:.08em;margin-bottom:6px}
.nm input{width:min(240px,70vw);height:46px;border:2px solid var(--gY);background:var(--scr);color:var(--gY);font-family:var(--pixel);font-weight:700;font-size:20px;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.nm input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gY) 35%,transparent)}
.board{width:min(100%,380px);background:var(--scr2);border:2px solid var(--line);padding:10px 12px;display:grid;gap:4px;text-align:left}
.board h3{margin:0 0 4px;font-family:var(--pixel);font-size:12px;font-weight:400;letter-spacing:.1em;color:var(--gR);text-align:center}
.brow{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;gap:8px;align-items:center;font-family:var(--pixel);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;min-height:26px}
.brow .s{text-align:right}
.brow img{width:26px;height:26px;object-fit:contain}
.brow.mugi{color:var(--gP)}.brow.mugi .s{text-shadow:var(--glowP)}
.brow.you{color:var(--gY);background:var(--hiRow);font-weight:700}
.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mline{display:flex;gap:10px;align-items:center;text-align:left;background:var(--scr2);border:1px dashed var(--line);padding:8px 12px;max-width:380px;width:100%}
.mline img{width:56px;height:56px;object-fit:contain;flex:none}
.mline p{margin:0;font-size:.92em}
.res .row{justify-content:center}
.iconbtn.off{opacity:.55;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.sign h1,.bulbs,.crt,.newhi,.grade,.timer.low,.fx-cd b{animation:none!important}}
.gc svg{display:block;width:100%;height:100%}
.gc svg text{font-family:var(--body);font-weight:700}
.gc svg .mv,.gc svg .idle{transform-box:fill-box;transform-origin:center;transition:transform .25s}
.gc:hover svg .mv,.gc:focus-visible svg .mv{transform:translate(-4px,2px) rotate(-6deg)}
.gc svg .idle{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.tcount{font-family:var(--mono);font-size:.82em;color:var(--soft);font-weight:600}
.sndb{min-width:44px;height:44px;font-size:18px}
/* ---------- game bar ---------- */
.gbar{display:flex;align-items:center;gap:8px;min-height:44px}
.gbar .gt{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:1.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar .bk{min-height:44px}
.gbar .iconbtn{min-width:44px;height:44px;font-weight:800;font-size:17px}
.ready{text-align:center;color:var(--soft);padding:40px 0}
/* ---------- dialogs ---------- */
dialog.dlg{border:0;padding:0;background:var(--bg);color:var(--ink);border-radius:20px;width:min(540px,calc(100% - 16px));max-width:none;max-height:min(88vh,760px);max-height:min(88dvh,760px);box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg::backdrop{background:rgba(20,10,6,.55)}
.dlg .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dlg .dh h2{margin:0;font-size:1.12em;flex:1;min-width:0}
.dlg .dh .bk{min-height:44px}
.dlg .db{padding:14px 10px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.dlg .db>*{flex:none}
.dlg .df{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dlg .df .btn{min-height:44px}
.dlg .df .btn.primary{margin-left:auto}
.dlg p{margin:0}
.tg{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tgh{display:flex;align-items:center;gap:0;padding:0;min-height:48px}
.tgh .tog{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:inherit;font-size:.9em;font-weight:700;text-align:left;padding:6px 6px 6px 6px;min-height:48px;border-radius:11px;cursor:pointer}
.tgh .tog .chev{flex:none;width:16px;height:16px;color:var(--soft);transition:transform .18s}
.tgh .tog[aria-expanded=true] .chev{transform:rotate(90deg)}
.tgh .tog .ic{flex:none;font-size:1.05em;line-height:1}
.tgh .tog .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tgh .n{font-family:var(--mono);font-size:.76em;color:var(--soft);font-weight:600;flex:none;min-width:2.9em;text-align:right}
.tgh .gall{flex:none;width:42px;height:44px;display:grid;place-items:center;cursor:pointer}
.tgh .gall input{width:22px;height:22px;margin:0;accent-color:var(--lupine)}
.unitpick{display:grid;gap:0;padding:2px 10px 6px 30px;border-top:1px solid var(--line)}
.unitpick label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.92em;line-height:1.3;min-height:44px}
.unitpick input{accent-color:var(--lupine);width:22px;height:22px;flex:none}
.howart{border-radius:14px;overflow:hidden}
body.nofuri ruby rt{visibility:hidden}
body.nofuri ruby.peek rt{visibility:visible}
body.nofuri .stage ruby,body.nofuri .card ruby{cursor:help;text-decoration:underline dotted color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:4px}
.sndb.furib span{font-size:.95em;font-weight:700}
.howlist{margin:0;padding-left:20px;display:grid;gap:6px}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;font-size:.92em}
.chk input{width:20px;height:20px;accent-color:var(--lupine)}
/* ---------- shared game bits ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-family:var(--mono);font-weight:600}
.timer{font-size:1.4em}.timer.low{color:var(--bad)}
.hearts{letter-spacing:3px}
.flash{min-height:180px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:grid;gap:2px;padding:10px 6px}
.rate small{font-weight:400;color:var(--soft);font-size:.78em}
.big{font-family:var(--display);font-size:clamp(40px,10vw,64px);font-weight:800;line-height:1}
.flashq{font-size:1.12em;font-weight:700}
.missed{display:grid;gap:8px}
.mrow{display:flex!important;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mrow.gone>span{opacity:.5;text-decoration:line-through}.missed .card{display:grid;gap:4px}
/* Japanese games */
.segs{display:flex;flex-wrap:wrap;gap:8px}
.segs button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:44px;font:inherit;font-weight:700}
.segs button[aria-pressed=true]{border-color:var(--lupine);background:var(--lupTint);color:var(--lupine)}
.stage{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center;display:grid;gap:6px;justify-items:center}
.glyph{font-size:clamp(48px,16vw,84px);line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.glyph.rd{font-size:clamp(48px,13vw,72px)}
.qsub{color:var(--soft);font-size:1.1em}
.qtext{font-size:.92em;color:var(--soft)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{-webkit-user-select:none;user-select:none;display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px;min-height:64px;font:inherit;font-weight:700;cursor:pointer;overflow-wrap:anywhere;min-width:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.choice .k{font-family:var(--mono);font-size:.75em;color:var(--soft);flex:none}
.choice [lang=ja]{font-size:1.35em}
.choice.kj [lang=ja]{font-size:2.2em;line-height:1.1}
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--lupine)}}
.choice.ok{border-color:var(--ok);background:var(--okTint)}
.choice.no{border-color:var(--bad);background:var(--badTint)}
.choice:disabled{cursor:default}
.setup{gap:0}
.setup .sg{display:grid;gap:10px;padding:16px 0}
.setup .sg:first-child{padding-top:0}
.setup .sg + .sg,.setup .sg + .row{border-top:1.5px dashed var(--line)}
.setup .row{padding-top:18px}
.combo{font-family:var(--mono);color:var(--rose)}
.combo.hot{animation:pulse .5s}
.tbar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;width:100%}
.tbar i{display:block;height:100%;background:var(--gold);border-radius:99px;width:100%;transform-origin:left}
.float{position:absolute;right:14px;bottom:10px;font-family:var(--display);font-weight:800;color:var(--ok);animation:up .8s forwards;pointer-events:none}
/* "jg-" names: the shared .pop class is the glossary popover (fixed, removed on the next click) */
.jg-shake{animation:shake .35s}
.jg-pulse{animation:pulse .3s}
.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.pairs{grid-template-columns:repeat(4,1fr)}}
.pc{min-height:76px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;font:inherit;font-weight:700;cursor:pointer;padding:6px;overflow-wrap:anywhere;min-width:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pc.kc{font-size:clamp(34px,10vw,44px);line-height:1}
.pc.rc{font-size:1.1em;background:var(--panel2)}
.pc.sel{border-color:var(--lupine);box-shadow:0 0 0 3px var(--lupTint)}
.pc.done{visibility:hidden}
.pc.no{border-color:var(--bad);background:var(--badTint)}
.stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
#gm .opt{touch-action:manipulation}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes up{to{transform:translateY(-28px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.jg-shake,.jg-pulse,.combo.hot,.float,.gc svg .idle{animation:none}.gc,.gc svg .mv{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Loading…</p></main>
<script>
(function(){
var esc = ICA.esc, md = ICA.md, app = document.getElementById("app"), bar;
var BOX_DAYS = [0, 1, 3, 7, 14, 30], DAY = 86400000;
var picked = null, timerId = null, cur = {s:"home"}, paused = false, openD = null;
var LESSON = ["practice","cards","blitz","survival"];

function setTitle(t){ document.title = t + " · Arcade"; bar.querySelector(".title").textContent = t; }
function unitsWithQs(){ return ICA.units.filter(function(u){ return ICA.bank.some(function(q){ return q.unit === u.id; }); }); }
function pool(){ return ICA.bank.filter(function(q){ return picked.indexOf(q.unit) > -1; }); }
function cards(){ return ICA.load().cards; }
function dueList(){ var now = Date.now(), c = cards(); return pool().filter(function(q){ return c[q.id] && c[q.id].due <= now; }); }
function newList(){ var c = cards(); return pool().filter(function(q){ return !c[q.id]; }); }
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
/* every visit starts with nothing ticked; the choice lasts until the player leaves the Arcade */
function savedPick(){ return []; }
function rememberPick(){}

/* ---------- history: every screen is a history entry, so the browser's Back works ---------- */
function depth(){ return (history.state && history.state.d) || 0; }
function push(s){ s.d = depth() + 1; try { history.pushState(s, ""); } catch(e){} }
function replace(s){ s.d = depth(); try { history.replaceState(s, ""); } catch(e){} }
function goBack(){ if (depth() > 0) history.back(); else { stopGame(); home(); } }
function goHome(){ var d = depth(); if (d > 0) history.go(-d); else { stopGame(); home(); } }
function stopGame(){ stopTimer(); keyFn = null; paused = false; if (cur.stop) cur.stop(); if (cur.cancel) cur.cancel(); cur.alive = false; AFX.musicStop(); }
function progress(){ return cur.s === "play" && cur.alive && cur.answered > 0 && cur.g !== "cards"; }
function render(s){
  stopGame(); window.scrollTo(0, 0);
  if (!s || s.s === "home") return home();
  if (GAMES[s.g]){ if (s.s !== "setup") replace({s:"setup", g:s.g}); return withData(function(){ setup(s.g); }); }
  replace({s:"home"}); home();
}
var pendingPop = null;
window.addEventListener("popstate", function(e){
  if (pendingPop){ var f = pendingPop; pendingPop = null; f(); return; }   // a dialog closing its own history entry
  if (openD){ closeDlg("nav"); return; }                                   // Back closes an open pop-up
  if (progress()){ try { history.pushState(cur.hs, ""); } catch(err){} confirmQuit(); return; }
  render(e.state);
});

/* ---------- sound: one setting (settings.sound), shared with the home page's Settings ---------- */
var AFX = window.ArcadeFX;
function jp(){ return JG.store(ICA.load()); }
function soundOn(){ var s = ICA.load().settings.sound; return s ? s !== "off" : jp().snd !== false; }
function setSound(on){ ICA.load().settings.sound = on ? "on" : "off"; jp().snd = on; ICA.save(); if (!on) AFX.musicStop(); else if (cur.s === "play" && cur.alive && cur.g !== "cards") AFX.musicStart(); }
/* music has its own switch (Arcade only); it plays during games, never on menus */
function musicOn(){ return ICA.load().arcade.music !== false; }
function setMusic(on){ ICA.load().arcade.music = on; ICA.save(); if (!on) AFX.musicStop(); else if (cur.s === "play" && cur.alive && cur.g !== "cards") AFX.musicStart(); }
AFX.soundOn = soundOn; AFX.musicOn = musicOn;
function beep(kind, arg){ AFX.sfx(kind, arg); }
function sndBtn(){ var on = soundOn(), mu = musicOn();
  return '<button class="iconbtn sndb" data-snd aria-pressed="'+on+'" aria-label="Sound effects" title="Sound '+(on ? "on" : "off")+'"><span aria-hidden="true">'+(on ? "🔊" : "🔇")+'</span></button>'+
    '<button class="iconbtn sndb'+(mu ? "" : " off")+'" data-mus aria-pressed="'+mu+'" aria-label="Music" title="Music '+(mu ? "on" : "off")+'"><span aria-hidden="true">♪</span></button>'+
    '<button class="iconbtn sndb furib'+(furiOn() ? "" : " off")+'" data-furi aria-pressed="'+furiOn()+'" aria-label="Furigana (readings above kanji)" title="'+furiTitle()+'"><span aria-hidden="true">ふ</span></button>'; }
/* furigana: on by default; off hides the readings above kanji so the kanji have to be read. Tap a word in a question to peek. */
function furiOn(){ return ICA.load().arcade.furi !== false; }
function furiTitle(){ return furiOn() ? "Furigana shown" : "Furigana hidden: tap a word in a question to peek"; }
function applyFuri(){ document.body.classList.toggle("nofuri", !furiOn()); }
function syncSnd(){ var on = soundOn(), mu = musicOn();
  ICA.$$("[data-snd]").forEach(function(b){ b.setAttribute("aria-pressed", on); b.title = "Sound "+(on ? "on" : "off"); b.firstChild.textContent = on ? "🔊" : "🔇"; });
  ICA.$$("[data-mus]").forEach(function(b){ b.setAttribute("aria-pressed", mu); b.title = "Music "+(mu ? "on" : "off"); b.classList.toggle("off", !mu); });
  ICA.$$("[data-furi]").forEach(function(b){ b.setAttribute("aria-pressed", furiOn()); b.title = furiTitle(); b.classList.toggle("off", !furiOn()); }); applyFuri(); }
/* a right or wrong answer: sound, effects and score pop. streak = the streak after a right answer, or the streak just lost */
function hit(ok, el, streak, pts){
  var scr = document.getElementById("scr");
  if (ok){
    beep("ok", Math.max(0, streak - 1)); AFX.jelly(el); AFX.burst(scr, el, streak >= 5 ? 34 : 16);
    if (pts != null) AFX.pop(scr, el, typeof pts === "number" ? "+"+AFX.num(pts) : pts);
    if (streak && streak % 5 === 0){ setTimeout(function(){ beep("combo"); }, 120); AFX.flash(scr); AFX.slam(scr, "COMBO ×"+streak+"!"); }
  } else { beep(streak >= 3 ? "boom" : "no"); AFX.shake(scr); }
}

/* ---------- game cards (inline art) ---------- */
var ART = {
  practice:'<circle cx="44" cy="38" r="25" class="A"/><circle cx="44" cy="38" r="18" class="P"/><circle cx="44" cy="38" r="11" class="A"/><circle cx="44" cy="38" r="4.5" class="P"/><g class="mv"><g transform="translate(44 38) rotate(-32)"><path d="M8 0 H50" class="S" style="stroke:var(--ink);stroke-width:3"/><path d="M0 0 L11 -5.5 L11 5.5 Z" class="K"/><path d="M41 0 L52 0 L59 -8 L48 -8 Z M41 0 L52 0 L59 8 L48 8 Z" class="G" style="stroke:var(--panel);stroke-width:1"/></g></g><circle cx="100" cy="54" r="2.5" class="G idle"/><circle cx="16" cy="12" r="3" class="G idle"/>',
  cards:'<rect x="30" y="14" width="40" height="46" rx="6" class="O" transform="rotate(-14 50 37)"/><rect x="44" y="11" width="40" height="46" rx="6" class="O" transform="rotate(-3 64 34)"/><g class="mv"><g transform="rotate(9 76 33)"><rect x="56" y="10" width="40" height="46" rx="6" class="A"/><text x="76" y="33" text-anchor="middle" dominant-baseline="central" font-size="26" class="P">?</text></g></g><path d="M18 22 l4 4 M22 22 l-4 4" class="S idle"/>',
  blitz:'<circle cx="46" cy="38" r="22" class="O"/><rect x="41" y="8" width="10" height="7" rx="2" class="A"/><path d="M46 38 L46 24 M46 38 L56 44" class="S" style="stroke:var(--ink)"/><g class="mv idle"><path d="M84 4 L68 34 H80 L72 62 L98 26 H85 L93 4 Z" class="G" style="stroke:var(--panel);stroke-width:2"/></g>',
  survival:'<g transform="translate(-6 0)"><g class="idle"><path d="M14 30 C14 20 28 18 30 28 C32 18 46 20 46 30 C46 42 30 50 30 56 C30 50 14 42 14 30 Z" class="R"/></g><path d="M44 26 C44 16 58 14 60 24 C62 14 76 16 76 26 C76 38 60 46 60 52 C60 46 44 38 44 26 Z" class="R"/><g class="mv"><path d="M74 30 C74 20 88 18 90 28 C92 18 106 20 106 30 C106 42 90 50 90 56 C90 50 74 42 74 30 Z" class="O" style="stroke:var(--rose)"/></g></g>',
  sprint:'<path d="M10 24 H30 M6 34 H26 M12 44 H28" class="S idle"/><g class="mv"><rect x="36" y="8" width="58" height="44" rx="12" class="A"/><path d="M50 50 L46 62 L60 51 Z" class="A"/><text x="65" y="30" text-anchor="middle" dominant-baseline="central" font-size="28" class="P" lang="ja">語</text></g><circle cx="102" cy="50" r="3" class="G"/><circle cx="108" cy="40" r="2" class="G"/>',
  match:'<g transform="translate(-5 0)"><g class="mv"><rect x="10" y="14" width="42" height="42" rx="9" class="A"/><text x="31" y="35" text-anchor="middle" dominant-baseline="central" font-size="27" class="P" lang="ja">字</text></g><path d="M56 35 H64 M61 31.5 L64.5 35 L61 38.5" class="S" style="stroke:var(--soft);stroke-width:2.5"/><rect x="69" y="8" width="34" height="14" rx="7" class="O" style="stroke:var(--line)"/><path d="M77 15 H95" class="S" style="stroke:var(--line);stroke-width:3"/><rect x="69" y="28" width="34" height="14" rx="7" class="O" style="stroke:var(--ok);fill:var(--okTint)"/><text x="81" y="35" text-anchor="middle" dominant-baseline="central" font-size="10.5" class="K" lang="ja">じ</text><circle cx="95" cy="35" r="5" style="fill:var(--ok)"/><path d="M92.6 35.1 L94.4 36.9 L97.6 33.4" class="S" style="stroke:var(--panel);stroke-width:1.6"/><rect x="69" y="48" width="34" height="14" rx="7" class="O" style="stroke:var(--line)"/><path d="M77 55 H95" class="S" style="stroke:var(--line);stroke-width:3"/></g>',
  pairs:'<g transform="translate(-6 0)"><g class="mv"><g transform="rotate(-6 33 35)"><rect x="14" y="12" width="38" height="46" rx="7" class="A"/><text x="33" y="35" text-anchor="middle" dominant-baseline="central" font-size="24" class="P" lang="ja">山</text></g></g><g transform="rotate(6 87 35)"><rect x="68" y="12" width="38" height="46" rx="7" class="O"/><text x="87" y="35" text-anchor="middle" dominant-baseline="central" font-size="13" class="K" lang="ja">やま</text></g><path d="M52 34 h16" class="S idle" style="stroke-dasharray:3 4"/></g>',
  lab:'<path d="M50 8 h20 M54 8 v18 L36 58 Q34 62 40 62 H80 Q86 62 84 58 L66 26 V8" class="O"/><path d="M44 46 H76 L83 58 Q84 61 80 61 H40 Q36 61 37 58 Z" class="A"/><text x="60" y="53.5" text-anchor="middle" dominant-baseline="central" font-size="12" class="P" lang="ja">漢</text><circle cx="58" cy="36" r="3" class="A idle"/><circle cx="66" cy="30" r="2" class="A idle"/><path d="M94 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" class="G"/>'
};
function art(g){ return '<svg viewBox="0 0 120 70" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">'+ART[g]+'</svg>'; }
function card(mode, name, key, sub, acc){
  return '<button class="gc '+acc+'" data-mode="'+mode+'"><span class="mq">'+esc(name.toUpperCase())+'</span><span class="art">'+art(mode)+'</span>'+
    (key ? '<span class="hs"><span>HI SCORE</span><em>MUGI '+AFX.fmt(key, AFX.MUGI[key])+'</em></span>' : '')+'<span class="sub">'+sub+'</span></button>';
}
function topicsLabel(){ var n = picked.length; return n ? n+" unit"+(n === 1 ? "" : "s") : "none yet"; }
/* the player's own best on a board */
function mine(key){ var t = AFX.top(ICA.load(), key); return t == null ? "" : ' · You <b>'+AFX.fmt(key, t)+'</b>'; }
/* old "best" numbers become the first board entries (Blitz and Survival now score points, so they start fresh) */
function migrateBoards(){
  var st = ICA.load(), a = st.arcade, j = jp(), ch = false;
  if (a.boardsV) return;
  [["practice", a.best.practice], ["sprint", j.best.sprint], ["match", j.best.match], ["pairs", j.best.pairs]].forEach(function(x){
    if (x[1] != null && x[1] > 0 && !AFX.board(st, x[0]).length){ AFX.board(st, x[0]).push({n:AFX.name(st), s:x[1], t:Date.now()}); ch = true; } });
  a.boardsV = 1; ICA.save();
}
function home(){
  stopGame(); cur = {s:"home", hs:{s:"home", d:depth()}}; setTitle("Arcade");
  if (!picked) picked = savedPick();
  var st = ICA.load(), due = picked.length ? dueList().length : 0, T = todayInfo();
  app.innerHTML = '<div class="arc">'+
    '<div class="ctlrow">'+sndBtn()+'</div>'+
    '<div class="sign"><div class="bulbs"></div><h1>MUGI’S ARCADE</h1><div class="bulbs alt"></div></div>'+
    '<button class="today" data-today><span class="tl">TODAY’S CHALLENGE</span><span class="td">'+esc(T.desc)+'</span><span class="tm">'+T.meta+'</span><span class="go" aria-hidden="true">PLAY ▶</span></button>'+
    '<section aria-labelledby="h-les"><div class="sh"><h2 id="h-les">Lesson games</h2><button class="btn small" id="topics" aria-haspopup="dialog">Topics: <span class="tcount" id="tcount">'+topicsLabel()+'</span></button></div>'+
    '<div class="games">'+
      card("practice","Practice","practice","10 questions, no clock"+mine("practice"),"a2")+
      card("cards","Flashcards",null,(due ? '<b>'+due+' due today</b> · ' : '')+"spaced review, no score","a4")+
      card("blitz","Blitz","blitz","60 seconds, go!"+mine("blitz"),"a1")+
      card("survival","Survival","survival","Three hearts"+mine("survival"),"a3")+
    '</div></section>'+
    '<section aria-labelledby="h-jp"><div class="sh"><h2 id="h-jp">Japanese</h2><span class="small muted" lang="ja">日本語</span></div>'+
    '<div class="games">'+
      card("sprint","Word Sprint","sprint","Word → meaning"+mine("sprint"),"a1")+
      card("match","Kanji Match","match","Beat the clock"+mine("match"),"a2")+
      card("pairs","Pair Up","pairs","Kanji ↔ reading"+mine("pairs"),"a3")+
      '<a class="gc a4" href="../labs/kanji.html?from=arcade"><span class="mq">KANJI LAB</span><span class="art">'+art("lab")+'</span><span class="sub">Your missed cards, on a calm daily schedule →</span></a>'+
    '</div></section>'+
  '</div>';
}

/* ---------- dialogs (native <dialog>: modal, focus kept inside, Esc closes) ---------- */
function dlg(head, body, foot, o){
  closeDlg("replace");
  var d = document.createElement("dialog"); d.className = "dlg"; d.setAttribute("aria-labelledby", "dlgt");
  d.innerHTML = '<div class="dh">'+head+'</div><div class="db">'+body+'</div>'+(foot ? '<div class="df">'+foot+'</div>' : '');
  document.body.appendChild(d);
  if (!d.showModal){ d.close = function(v){ d.returnValue = v || ""; d.removeAttribute("open"); d.dispatchEvent(new Event("close")); }; }
  openD = {el:d, o:o}; var was = paused; if (cur.s === "play" && cur.alive && !was) setPaused(true);
  if (!(history.state && history.state.m)){ var hs = {}, b = cur.hs || {s:"home"}; for (var k in b) hs[k] = b[k]; hs.m = 1; push(hs); }
  d.addEventListener("click", function(e){ var r = e.target.closest("[data-r]"); if (r){ d.close(r.getAttribute("data-r")); return; } if (o.click) o.click(e); });
  d.addEventListener("close", function(){
    var r = d.returnValue || "esc"; if (d.parentNode) d.parentNode.removeChild(d); if (openD && openD.el === d) openD = null;
    function after(){ if (r !== "replace" && !was && cur.s === "play" && cur.alive) setPaused(false); if (o.onClose) o.onClose(r); }
    if (r !== "nav" && r !== "replace" && history.state && history.state.m){ pendingPop = after; history.back(); } else after();
  });
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  var f = d.querySelector("[autofocus]"); if (f) f.focus();
  return d;
}
function closeDlg(r){ if (openD){ var d = openD.el; d.close(r); } }
function backBtn(label){ return '<button class="btn small bk" data-r="back">‹ '+(label || "Back")+'</button>'; }

/* topics: grouped by track, collapsible, All / None per group, remembered */
function topicsDlg(then){
  var us = unitsWithQs(), groups = {}, order = [], st = ICA.load();
  us.forEach(function(u){ if (!groups[u.track]){ groups[u.track] = []; order.push(u.track); } groups[u.track].push(u); });
  var anyOn = picked.length > 0;
  function cnt(tid){ return groups[tid].filter(function(u){ return picked.indexOf(u.id) > -1; }).length; }
  var body = '<p class="small muted">Lesson games ask questions from the units you tick.</p>'+
    order.map(function(tid, gi){
      var t = ICA.tracks[tid] || {name:tid, icon:""}, list = groups[tid], open = false;
      return '<div class="tg"><div class="tgh"><button type="button" class="tog" data-tog="'+tid+'" aria-expanded="'+open+'" aria-controls="up-'+tid+'"><svg class="chev" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ic" aria-hidden="true">'+(t.icon||"")+'</span><span class="tn">'+esc(t.name)+'</span></button>'+
        '<span class="n" data-cnt="'+tid+'">'+cnt(tid)+'/'+list.length+'</span><label class="gall" title="All or none"><input type="checkbox" data-grp="'+tid+'" aria-label="All '+esc(t.name)+' units"></label></div>'+
        '<div class="unitpick" id="up-'+tid+'"'+(open ? '' : ' hidden')+'>'+list.map(function(u){ return '<label><input type="checkbox" data-unit="'+u.id+'" data-tr="'+tid+'"'+(picked.indexOf(u.id) > -1 ? " checked" : "")+'>'+esc(u.title)+'</label>'; }).join("")+'</div></div>';
    }).join("");
  var go = then ? '<button class="btn primary" data-r="start" id="tstart">Start '+esc(LNAME[then])+'</button>' : '<button class="btn primary" data-r="done" id="tstart">Done</button>';
  var d = dlg(backBtn()+'<h2 id="dlgt">Choose topics</h2>', body, '<span class="small muted" id="tsum"></span>'+go, {onClose:function(r){
    var t = document.getElementById("tcount"); if (t) t.textContent = topicsLabel();
    if (r === "start" && then && pool().length) setTimeout(function(){ launch(then); }, 0);
  }, click:function(e){
    var t = e.target.closest("[data-tog]");
    if (t){ var on = t.getAttribute("aria-expanded") !== "true"; t.setAttribute("aria-expanded", on); document.getElementById("up-"+t.getAttribute("data-tog")).hidden = !on; }
  }});
  /* the group checkbox ticks or clears the whole group (it shows "some" as indeterminate) */
  function groupAll(tid, all){
    ICA.$$('[data-tr="'+tid+'"]', d).forEach(function(cb){ cb.checked = all; var id = cb.getAttribute("data-unit"); picked = picked.filter(function(x){ return x !== id; }); if (all) picked.push(id); });
  }
  function sync(){
    order.forEach(function(tid){ var c = cnt(tid), n = groups[tid].length, g = d.querySelector('[data-grp="'+tid+'"]');
      d.querySelector('[data-cnt="'+tid+'"]').textContent = c+"/"+n; g.checked = c === n; g.indeterminate = c > 0 && c < n; });
    rememberPick(); var n = pool().length;
    d.querySelector("#tsum").textContent = n ? n+" question"+(n === 1 ? "" : "s") : "Tick at least one unit";
    if (then) d.querySelector("#tstart").disabled = !n;
  }
  d.addEventListener("change", function(e){ var g = e.target.closest("[data-grp]"); if (g){ groupAll(g.getAttribute("data-grp"), g.checked); sync(); return; }
    var t = e.target.closest("[data-unit]"); if (!t) return; var id = t.getAttribute("data-unit"); if (t.checked){ if (picked.indexOf(id) < 0) picked.push(id); } else picked = picked.filter(function(x){ return x !== id; }); sync(); });
  sync();
}

/* ---------- entering a game ---------- */
function gbar(title, quit){ return '<div class="gbar"><button class="btn small bk" data-back>‹ '+(quit ? "Quit" : "Back")+'</button><span class="gt">'+esc(title)+'</span>'+(quit !== null ? '<button class="iconbtn" data-help aria-label="How to play" aria-haspopup="dialog">?</button>' : '')+sndBtn()+'</div>'; }
function launch(g, again){
  if (LESSON.indexOf(g) > -1 && !pool().length){ topicsDlg(g); return; }
  stopGame(); window.scrollTo(0, 0);
  if (history.state && history.state.m){ pendingPop = function(){ launch(g, again); }; history.back(); return; }
  var hs = {s:"play", g:g}; if (again) replace(hs); else push(hs);
  cur = {s:"play", g:g, answered:0, alive:true, hs:history.state || hs};
  snaps = {};
  setTitle(LNAME[g]);
  var key = g === "cards" ? null : g, t = key ? AFX.top(ICA.load(), key) : null;
  app.innerHTML = '<div class="stack">'+gbar(LNAME[g], true)+'<div class="crt" id="scr">'+
    (key ? '<div class="hiline"><span>HI SCORE <b>MUGI '+AFX.fmt(key, AFX.MUGI[key])+'</b></span>'+(t != null ? '<span>YOUR BEST '+AFX.fmt(key, t)+'</span>' : '')+'</div>' : '')+
    '<div id="gm"><p class="ready">Ready…</p></div></div></div>';
  var run = function(){ if (!cur.alive) return; var gm = document.getElementById("gm");
    if (GAMES[g]){ var j = jp(), p = JG.pool(GAMES[g].kind, j.level, j); ({sprint:sprint, match:match, pairs:pairs})[g](gm, p, j.level); }
    else ({practice:practice, blitz:blitz, survival:survival, cards:flashcards, today:todayGame})[g](gm); };
  var go = function(){ if (!cur.alive) return;
    if (g === "cards") return run();          // Flashcards stays calm: no countdown, no music
    AFX.musicStart();
    cur.cancel = AFX.countdown(document.getElementById("scr"), function(){ cur.cancel = null; run(); }); };
  if (howSeen(g)) go(); else howDlg(g, true, go);
}
function finish(g){ cur.alive = false; cur.s = "done"; replace({s:"done", g:g}); cur.hs = history.state; keyFn = null; AFX.musicStop(); window.scrollTo(0, 0); }
function resultsBar(g){ return gbar(LNAME[g]+" · results", null); }

/* ---------- one question (shared by practice, blitz, survival) ---------- */
function ask(box, q, quick, cb){
  box.innerHTML = ""; var d = document.createElement("div"); box.appendChild(d);
  ICA.exercise(d, {id:q.id, type:"mcq", q:q.q, options:q.options, why:q.why, fixed:q.fixed}, {quiz:true, onAnswer:function(ok){ if (!cur.alive) return; cur.answered++; logMiss(q, ok);
    cb(ok, d.querySelector('[aria-checked="true"]') || d.querySelector(".right")); }});
  if (quick){ var f = d.querySelector(".fbw"); if (f) f.hidden = true; }
}
/* misses in the lesson games are kept (with the date) for Today's Challenge; a later right answer clears them */
function logMiss(q, ok){ var a = ICA.load().arcade; a.miss = a.miss || {}; if (ok){ if (a.miss[q.id]){ delete a.miss[q.id]; ICA.save(); } } else { a.miss[q.id] = Date.now(); ICA.save(); } }
function review(missed){
  if (!missed.length) return '<p>No misses. 🎉</p>';
  return '<h2>Worth another look</h2><div class="missed">'+missed.map(function(q){ var r = q.options.filter(function(o){ return o.ok; }); return '<div class="card"><b>'+md(q.q)+'</b><span><b>Answer:</b> '+r.map(function(o){ return md(o.t); }).join("; ")+'</span><span class="small">'+md(r[0].why||"")+(q.why ? " "+md(q.why) : "")+'</span></div>'; }).join("")+'</div>';
}
function endScreen(key, score, sub, missed, right, seen){
  stopTimer(); finish(key);
  results({key:key, title:LNAME[key], score:score, sub:sub, grade:AFX.grade(right, seen, key === "practice" ? 10 : 5), review:review(missed)});
}
function hudL(left){ return '<div class="hud">'+left+'<span class="combo" id="cb" aria-label="Streak"></span><span>SCORE <span id="sc">0</span></span></div>'; }
var points = function(streak){ return 100 + 20*Math.min(streak - 1, 10); };

/* ---------- practice ---------- */
function practice(gm){
  var qs = ICA.shuffle(pool()).slice(0, 10), i = 0, score = 0, streak = 0, missed = [];
  gm.innerHTML = '<div class="stack">'+hudL('<span>Q <span id="pos">1</span>/'+qs.length+'</span>')+'<div id="qb"></div><div id="nav"></div></div>';
  function next(){
    document.getElementById("pos").textContent = i+1; document.getElementById("nav").innerHTML = "";
    ask(document.getElementById("qb"), qs[i], false, function(ok, el){
      if (ok){ score++; streak++; hit(true, el, streak, "+1"); } else { hit(false, el, streak); streak = 0; missed.push(qs[i]); }
      AFX.roll(document.getElementById("sc"), score, String); showCombo(streak);
      document.getElementById("nav").innerHTML = '<div class="lessonnav"><span></span><button class="btn primary" id="nx">'+(i < qs.length-1 ? "Next →" : "Finish")+'</button></div>'; var b = document.getElementById("nx"); b.focus();
      b.onclick = function(){ i++; if (i < qs.length) next(); else endScreen("practice", score, score+" of "+qs.length+" right", missed, score, qs.length); }; });
  }
  next();
}

/* ---------- blitz ---------- */
function blitz(gm){
  var qs = ICA.shuffle(pool()), i = 0, score = 0, right = 0, seen = 0, streak = 0, missed = [], left = 60, busy = false;
  gm.innerHTML = '<div class="stack">'+hudL('<span class="timer" id="tm" aria-label="Seconds left">60</span>')+'<div id="qb"></div><p class="small muted">Answers flash green or red, then the next question appears. Full explanations come at the end.</p></div>';
  timerId = setInterval(function(){ if (paused) return; left--; var t = document.getElementById("tm"); if (!t){ stopTimer(); return; } t.textContent = left; t.classList.toggle("low", left <= 10); if (left <= 5 && left > 0) beep("tick");
    if (left <= 0) endScreen("blitz", score, right+" right of "+seen+" in 60 seconds", missed, right, seen); }, 1000);
  function next(){
    if (i >= qs.length){ qs = qs.concat(ICA.shuffle(pool())); }
    busy = false;
    ask(document.getElementById("qb"), qs[i], true, function(ok, el){ if (busy) return; busy = true; seen++;
      if (ok){ right++; streak++; var p = points(streak); score += p; hit(true, el, streak, p); } else { hit(false, el, streak); streak = 0; if (missed.indexOf(qs[i]) < 0) missed.push(qs[i]); }
      AFX.roll(document.getElementById("sc"), score, AFX.num); showCombo(streak);
      setTimeout(function(){ if (!timerId) return; i++; next(); }, ok ? 500 : 950); });
  }
  next();
}

/* ---------- survival ---------- */
function survival(gm){
  var qs = ICA.shuffle(pool()), i = 0, score = 0, right = 0, streak = 0, lives = 3, missed = [];
  gm.innerHTML = '<div class="stack">'+hudL('<span class="hearts" id="hp" aria-label="Hearts left">❤️❤️❤️</span>')+'<div id="qb"></div><div id="nav"></div></div>';
  function next(){
    document.getElementById("nav").innerHTML = "";
    if (i >= qs.length){ endScreen("survival", score, "You answered every question in the pool! "+right+" right.", missed, right, i); return; }
    ask(document.getElementById("qb"), qs[i], false, function(ok, el){
      if (ok){ right++; streak++; var p = points(streak); score += p; hit(true, el, streak, p); } else { hit(false, el, streak); streak = 0; lives--; missed.push(qs[i]); }
      AFX.roll(document.getElementById("sc"), score, AFX.num); showCombo(streak);
      document.getElementById("hp").textContent = lives > 0 ? new Array(lives+1).join("❤️") : "💔";
      document.getElementById("hp").setAttribute("aria-label", lives+" hearts left");
      var last = lives <= 0;
      document.getElementById("nav").innerHTML = '<div class="lessonnav"><span></span><button class="btn primary" id="nx">'+(last ? "See my score" : "Next →")+'</button></div>';
      var b = document.getElementById("nx"); b.focus(); b.onclick = function(){ if (last) endScreen("survival", score, right+" right before the hearts ran out", missed, right, i+1); else { i++; next(); } };
    });
  }
  next();
}

/* ---------- Today's Challenge: 10 questions picked from recent lessons and recent misses, the same set all day ---------- */
function history7(){
  var st = ICA.load(), now = Date.now(), recent = {}, older = {};
  Object.keys(st.lessons).forEach(function(id){ var s = st.lessons[id], u = id.split("-")[0]; if (!ICA.unitById[u]) return;
    if (s.done && now - s.done < 7*DAY) recent[u] = 1; else if (s.done || s.learn || Object.keys(s.tries || {}).length) older[u] = 1; });
  if (st.last && st.last.lesson){ var u = st.last.lesson.split("-")[0]; if (ICA.unitById[u] && now - (st.last.ts || 0) < 7*DAY) recent[u] = 1; }
  var m = st.arcade.miss || {}, missed = Object.keys(m).filter(function(k){ return ICA.bankById[k] && now - m[k] < 14*DAY; });
  return {recent:recent, older:older, missed:missed};
}
function jpMissKeys(){ return Object.keys(jp().missed || {}); }
function buildToday(){
  var st = ICA.load(), h = history7(), used = {}, out = [];
  function take(list, n){ ICA.shuffle(list).forEach(function(q){ if (n > 0 && q && !used[q.id]){ used[q.id] = 1; out.push("b:"+q.id); n--; } }); }
  var rq = ICA.bank.filter(function(q){ return h.recent[q.unit]; }), oq = ICA.bank.filter(function(q){ return h.older[q.unit] && !h.recent[q.unit]; }), mq = h.missed.map(function(id){ return ICA.bankById[id]; });
  take(mq, 3); take(rq, 5); take(oq, 2);
  ICA.shuffle(jpMissKeys()).slice(0, 2).forEach(function(k){ if (out.length < 10) out.push("j:"+k); });
  take(rq.concat(oq, mq), 10 - out.length);
  var starter = !out.length;
  if (out.length < 10){   // little history yet: the first unit of each chosen track (Digital Foundations if none)
    var tr = st.tracks.length ? st.tracks : ["t1"], first = {};
    ICA.units.forEach(function(u){ if (tr.indexOf(u.track) > -1 && !first[u.track] && ICA.bank.some(function(q){ return q.unit === u.id; })) first[u.track] = u.id; });
    var fu = Object.keys(first).map(function(k){ return first[k]; });
    take(ICA.bank.filter(function(q){ return fu.indexOf(q.unit) > -1; }), 10 - out.length);
    take(ICA.bank, 10 - out.length);
  }
  return {d:ICA.today(), ids:ICA.shuffle(out).slice(0, 10), starter:starter};
}
function todaySet(){
  var a = ICA.load().arcade, t = a.todaySet;
  if (!t || t.d !== ICA.today()){ t = a.todaySet = buildToday(); ICA.save(); }
  return t;
}
function todayInfo(){
  var a = ICA.load().arcade, t = todaySet(), dl = a.daily || {}, td = ICA.today();
  var streak = dl.last === td || dl.last === td - DAY ? dl.streak || 0 : 0, tb = dl.tb && dl.tb.d === td ? dl.tb.s : null;
  return {desc: t.starter ? "10 starter questions. As you finish lessons, the challenge is built from your own work." : "10 questions from your recent lessons and the ones you missed lately. A new set every day.",
    meta: (streak ? 'DAY STREAK <b>'+streak+'</b> · ' : '')+(tb != null ? 'TODAY <b>'+AFX.num(tb)+'</b> · ' : '')+'HI SCORE MUGI '+AFX.num(AFX.MUGI.today)};
}
function startToday(){ var ids = todaySet().ids; if (ids.some(function(x){ return x.indexOf("j:") === 0; })) withData(function(){ launch("today"); }); else launch("today"); }
function todayGame(gm){
  var T = todaySet(), items = [], jpItems = {};
  if (jpReady){ JG.pool("kanji", "missed", jp()).concat(JG.pool("vocab", "missed", jp())).forEach(function(it){ jpItems[it.key] = it; }); }
  T.ids.forEach(function(x){ if (x.indexOf("b:") === 0){ var q = ICA.bankById[x.slice(2)]; if (q) items.push({q:q}); } else { var it = jpItems[x.slice(2)]; if (it) items.push({it:it}); } });
  var n = items.length, i = 0, score = 0, right = 0, streak = 0, best = 0, missed = [], jmissed = [], t0 = 0;
  gm.innerHTML = '<div class="stack">'+hudL('<span>Q <span id="pos">1</span>/'+n+'</span>')+'<div id="qb"></div></div>';
  function next(){

  if (e.target.closest("[data-today]")){ startToday(); return; }
  if ((t = e.target.closest("[data-unmiss]"))){ unmiss(t.getAttribute("data-unmiss"), t); return; }
  if (e.target.closest("[data-unmissall]")){ ICA.$$("[data-unmiss]").forEach(function(b){ if (!b.disabled) unmiss(b.getAttribute("data-unmiss"), b); }); e.target.closest("[data-unmissall]").disabled = true; return; }
  if (e.target.closest("#topics")){ topicsDlg(); return; }
  if (e.target.closest("[data-help]")){ howDlg(cur.g, false); return; }
  if (e.target.closest("[data-back]")){ if (progress()) confirmQuit(); else { stopGame(); goBack(); } return; }
  if ((t = e.target.closest("[data-again]"))){ launch(t.getAttribute("data-again"), true); return; }
  if ((t = e.target.closest("[data-mode]"))){ var m = t.getAttribute("data-mode");
    if (GAMES[m]){ push({s:"setup", g:m}); withData(function(){ setup(m); }); return; }
    launch(m); return; }
  if (e.target.closest("[data-home]")){ goHome(); }
});
bar = ICA.topbar("Arcade");
try { history.replaceState({s:"home", d:0}, ""); } catch(e){}
/* a sheet (Settings, a glossary term) pauses the game clock like a dialog does */
var sheetPaused = false;
ICA.onSheet = function(open){
  if (open){ if (cur.s === "play" && cur.alive && !paused && !openD){ sheetPaused = true; setPaused(true); } }
  else if (sheetPaused){ sheetPaused = false; if (cur.s === "play" && cur.alive) setPaused(false); }
};
ICA.onSettings = function(k){ if (k === "sound"){ syncSnd(); if (!soundOn()) AFX.musicStop(); } };
ICA.loadAll("../", function(){ picked = savedPick(); migrateBoards(); applyFuri(); home(); }, {pixel:true});
})();
