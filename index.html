<style>
/* The hub: a top-down study desk. Every object is a link to an app. */
.hubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:10px}
.hubhead h1{color:var(--espresso)}
.cont{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.cont:hover{border-color:var(--rose)}
/* desk B: an open Quests notebook, a Progress sticky note and the Arcade console, other apps in a drawer */
.desk{position:relative;margin-top:28px;border-radius:22px;padding:16px 10px 20px;background:var(--wood1);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 19px,rgba(255,255,255,.03) 19px 21px,transparent 21px 47px),linear-gradient(180deg,var(--wood1),var(--wood2));box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),var(--shadow);display:grid;gap:16px}
.desk[hidden]{display:none}
/* dot-grid paper: dots every 11px, text on a 22px rhythm (two grid squares per line) */
.nbook{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:352/250;background:#fffaf2;border-radius:6px;box-shadow:0 7px 0 rgba(0,0,0,.28);position:relative;overflow:hidden;color:#2e1d15;--g:11px}
.nbook:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.1),transparent);pointer-events:none}
.pg{min-width:0;padding:22px 11px 22px 13px;background-image:radial-gradient(circle,rgba(107,84,68,.2) .75px,transparent 1.1px);background-size:var(--g) var(--g);background-position:5.5px 5.5px;display:grid;align-content:start;font-size:13px;line-height:22px;overflow-wrap:anywhere}
/* a paper-coloured halo behind the text, so the dots don't run through the letters */
.pg h3,.pg .mt,.pg .lt,.chk a,.chk .more,.pg .all{text-shadow:0 0 2px #fffaf2,0 0 2px #fffaf2,1px 0 1px #fffaf2,-1px 0 1px #fffaf2,0 1px 1px #fffaf2,0 -1px 1px #fffaf2}
.pg h3{margin:0;font-family:var(--display);font-size:16px;line-height:22px;color:#a24a28}
.pg .mt{color:#6b5444}
.pg .lt{font-family:var(--display);font-weight:800;font-size:15.5px;line-height:22px;color:#2e1d15}
.pg .cta{justify-self:start;background:#3b2419;color:#fffaf2;border-radius:99px;padding:0 14px;height:32px;line-height:32px;margin:6px 0;font-weight:700;font-size:13px;text-decoration:none}
.pg .cta:hover,.pg .cta:focus-visible{background:#a24a28}
.chk{display:grid;margin:0;padding:0;list-style:none}
.chk a{display:flex;gap:7px;align-items:flex-start;color:#2e1d15;text-decoration:none;min-width:0}
.chk a span{min-width:0}
.chk i{margin-top:4.5px;width:13px;height:13px;border:1.5px solid #6b5444;border-radius:3px;flex:none;display:grid;place-items:center;font-style:normal;font-size:9px;line-height:1}
.chk .d a{color:#6b5444;text-decoration:line-through}.chk .d i{background:#3d5c3e;border-color:#3d5c3e;color:#fff}
.chk .cur a{font-weight:700}.chk .cur i{border-color:#a24a28;box-shadow:0 0 0 2px rgba(162,74,40,.2)}
.chk .more{color:#6b5444}
.pg .all{color:#1f5a5c;font-weight:700;text-decoration:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sticky{background:#f3dd84;transform:rotate(-2deg);box-shadow:0 8px 10px -6px rgba(0,0,0,.45);font-family:"Comic Relief","Comic Sans MS",var(--body);color:#3b2a10;font-size:13.5px;line-height:1.4;padding:10px 12px;display:grid;gap:2px;border:0;text-align:left;width:100%;cursor:pointer;transition:transform .15s}
.sticky:hover,.sticky:focus-visible{transform:rotate(-1deg) translateY(-3px)}
.sticky b{font-size:17px}
.sticky .st{display:flex;justify-content:space-between;gap:8px}
.sticky small{font-size:11px;color:#6a5a30}
.obj{display:grid;gap:7px;justify-items:center;text-decoration:none;color:var(--ink)}
.tag{background:#fffaf2;color:#2b1c16;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center;line-height:1.35}
.tag small{display:block;font-weight:400;color:#6a5549;font-size:11px}
.console{width:100%;max-width:220px;aspect-ratio:1.65/1;background:#9a85cf;border-radius:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 5px 0 rgba(0,0,0,.28);display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:0 6%;transform:rotate(3deg);transition:transform .15s}
.obj:hover .console,.obj:focus-visible .console{transform:rotate(1deg) translateY(-3px)}
.dpad{width:28px;height:28px;justify-self:center;background:linear-gradient(#2b2440,#2b2440) center/9px 100% no-repeat,linear-gradient(#2b2440,#2b2440) center/100% 9px no-repeat}
.cscreen{background:#cfe0b7;border:4px solid #3d3456;border-radius:6px;aspect-ratio:1.3/1;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:#2f3d27;font-weight:600;text-align:center;line-height:1.15}
.abtn{display:grid;grid-template-columns:1fr 1fr;gap:4px;justify-self:center}.abtn i{width:12px;height:12px;border-radius:50%;background:#e8946c}.abtn i+i{background:#f0d27a;transform:translateY(-7px)}
.drawer{background:rgba(0,0,0,.2);border-radius:14px;padding:10px 8px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.drawer .dl{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#e9d9c2;text-transform:uppercase;padding-left:4px}
.mini{display:grid;gap:5px;justify-items:center;text-decoration:none}
.mini .ic{width:68px;height:68px;border-radius:16px;background:rgba(255,250,242,.1);display:grid;place-items:center;transition:transform .15s,background .15s}
.mini:hover .ic,.mini:focus-visible .ic{background:rgba(255,250,242,.2);transform:translateY(-3px)}
.mini span:last-child{font-size:12.5px;font-weight:700;color:#fffaf2}
.mini small{display:block;font-weight:400;font-size:10.5px;color:#e9d9c2;text-align:center}
.desk a:focus-visible,.desk button:focus-visible{outline:3px solid #f0d27a;outline-offset:3px}
@media (min-width:720px){.desk{padding:24px 22px 26px}.pg{font-size:14px}.row2{grid-template-columns:1.2fr 1fr}}
@media (prefers-reduced-motion:reduce){.sticky,.console,.mini .ic{transition:none}}
/* ---------- setup: meet Mugi, pick courses, choose where to start ---------- */
.setup{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.setup .sdots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px}.setup .sdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s}.setup .sdots i.on{background:var(--rose);width:20px;border-radius:9px}
.setup .sbody{flex:1;overflow-y:auto;padding:8px max(18px,env(safe-area-inset-left,0px)) 20px max(18px,env(safe-area-inset-right,0px))}
.setup .sin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.setup .sfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1.5px solid var(--line);background:var(--panel)}
.setup .sfoot .in{max-width:560px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setup .linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--lupine);font-weight:700;text-decoration:underline;cursor:pointer}
.setup .ghost{color:var(--soft);background:none;border:0;font:inherit;font-size:.95em;padding:8px 4px;cursor:pointer}
.setup .shi{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.1;margin:6px 0 0}
.setup .shi small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.13em;color:var(--rose);margin-bottom:4px}
.smeet{display:grid;grid-template-columns:40% minmax(0,1fr);gap:12px;align-items:start}
.smeet img{width:100%;height:auto;max-height:68vh;object-fit:contain;object-position:top}
.sbub{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px;font-size:.95em;margin-top:6%}
.sbub p{margin:0}
.sbub:before,.ssay p:before{content:"";position:absolute;width:12px;height:12px;background:inherit;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.sbub:before{left:-7.5px;top:34px}
.stip{border-left:3px solid var(--lupine);padding:2px 0 2px 10px;font-size:.92em;color:var(--soft)}
.ssay{display:flex;gap:10px;align-items:center}
.ssay img{width:58px;height:58px;object-fit:contain;flex:none}
.ssay p{position:relative;margin:0 0 0 4px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:9px 13px}
.ssay p:before{left:-7.5px;top:50%;margin-top:-6px}
.ssay.up{flex-direction:column}.ssay.up p{margin:6px 0 0;text-align:center}.ssay.up p:before{left:50%;top:-7.5px;margin:0 0 0 -6px;transform:rotate(135deg)}
.sgrp{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:4px 0 -4px}
.str{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 11px;cursor:pointer}
.str[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--panel))}
.str .ic{font-size:21px;grid-row:1/span 2}
.str b{font-family:var(--display);font-size:1.02em;line-height:1.2}
.str .d{grid-column:2;font-size:.82em;color:var(--soft);line-height:1.4}
.str .m{font-family:var(--mono);font-size:.92em;white-space:nowrap}
.str .ck{grid-row:1/span 2;grid-column:3;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff}
.str[aria-pressed="true"] .ck{background:var(--c);border-color:var(--c)}
.str:focus-visible,.sopt:focus-visible,.schip:focus-visible{outline:3px solid var(--lupine);outline-offset:2px}
.sopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.sopt .rd{grid-column:1;grid-row:1/span 2;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.sopt[aria-checked="true"]{border-color:var(--rose)}.sopt[aria-checked="true"] .rd{border:6px solid var(--rose)}
.sopt b{grid-column:2;font-family:var(--display)}
.sopt span.d{grid-column:2;font-size:.85em;color:var(--soft)}
.slv{margin:-4px 0 0 32px;display:flex;gap:6px;flex-wrap:wrap}
.schip{font:inherit;font-size:.88em;font-weight:700;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.schip[aria-pressed="true"]{background:var(--espresso);color:var(--bg);border-color:transparent}
.sdone{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.sdone img{width:190px;height:190px;object-fit:contain}
.sfirst{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:2px;text-align:left;width:100%;max-width:380px}
.sfirst b{font-family:var(--display);font-size:1.05em}
@media (min-width:640px){.smeet{grid-template-columns:36% minmax(0,1fr)}}
/* progress sheet */
.trackpick{display:grid;gap:8px}
.trackpick label{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trackpick input{width:20px;height:20px;margin-top:3px;accent-color:var(--rose)}
.notes li{margin:6px 0}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pstat b{font-family:var(--display);font-size:1.5em;line-height:1}.pstat b small{font-size:.55em;color:var(--soft)}
.pstat span{font-size:.82em;color:var(--soft)}
.ptrack{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ptrack summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;min-height:44px}
.ptrack summary .bar{grid-column:1/-1}
.ptrack summary::-webkit-details-marker{display:none}.ptrack .chev{display:inline-block;transition:transform .15s;color:var(--soft)}.ptrack[open] .chev{transform:rotate(90deg)}
.setlist .seg3 button{min-height:40px}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="hubhead">
    <div><div class="eyebrow">Your study desk</div><h1>IT CHICK Academy</h1></div>
    <button class="iconbtn" id="settingsbtn" aria-label="Settings">⚙︎</button>
  </div>
  <section class="today" id="today" aria-live="polite"></section>
  <div class="desk" id="desk" role="region" aria-label="Your desk">
    <div class="nbook" id="spread"></div>
    <div class="row2">
      <button class="sticky" id="notebtn" aria-label="Your progress: tracks, lessons and stats"></button>
      <a class="obj" href="arcade/index.html" aria-label="Arcade, practice games"><span class="console" aria-hidden="true"><span class="dpad"></span><span class="cscreen" id="cscreen">▶ PLAY</span><span class="abtn"><i></i><i></i></span></span><span class="tag">Arcade<small>practice games</small></span></a>
    </div>
    <nav class="drawer" aria-label="More on your desk"><span class="dl">More on your desk</span>
      <a class="mini" href="labs/index.html"><span class="ic" aria-hidden="true"><svg width="48" height="42" viewBox="0 0 34 30"><rect x="3" y="2" width="28" height="15" rx="2" fill="#2a2f3c" stroke="#9ea3ae" stroke-width="2"/><path d="M7 6h10M7 9h15M7 12h7" stroke="#7cc4c2" stroke-width="1.6"/><rect x="1" y="18" width="32" height="10" rx="2" fill="#c9ccd4"/><path d="M5 21h24M5 24h24" stroke="#8e929d" stroke-width="2" stroke-dasharray="2 1"/></svg></span><span>Labs<small>hands-on</small></span></a>
      <a class="mini" href="codex/index.html"><span class="ic" aria-hidden="true"><svg width="36" height="44" viewBox="0 0 26 32"><rect x="1" y="1" width="24" height="30" rx="3" fill="#efe4cf"/><rect x="1" y="1" width="6" height="30" fill="#8f6ca8"/><path d="M10 13h12M10 18h12" stroke="#5a4180" stroke-width="2"/></svg></span><span>Codex<small>look it up</small></span></a>
      <a class="mini" href="forge/index.html"><span class="ic" aria-hidden="true"><svg width="52" height="46" viewBox="0 0 34 30"><rect x="9" y="0" width="16" height="7" fill="#fffaf2"/><rect x="2" y="5" width="30" height="17" rx="4" fill="#e3dccf"/><rect x="7" y="8" width="20" height="4" rx="2" fill="#cfc6b6"/><rect x="9" y="18" width="16" height="11" fill="#fffaf2"/><path d="M11 22h12M11 25h9" stroke="#d9cdbd" stroke-width="1"/><circle cx="27" cy="15.5" r="1.8" fill="#7fbf6a"/></svg></span><span>Printer<small>printables</small></span></a>
    </nav>
  </div>
</main>
<script>
(function(){
var esc = ICA.esc, md = ICA.md, $ = ICA.$;

function trackIds(){ return Object.keys(ICA.tracks).sort(function(a,b){ return ICA.tracks[a].n - ICA.tracks[b].n; }); }
function hasUnits(tid){ return ICA.units.some(function(u){ return u.track === tid; }); }

function refreshDesk(){
  var st = ICA.load(), now = Date.now();
  var mine = st.tracks.filter(function(t){ return ICA.tracks[t]; });
  var done = Object.keys(st.lessons).filter(function(k){ return st.lessons[k].done && ICA.lessons[k]; }).length, total = Object.keys(ICA.lessons).length;
  var due = Object.keys(st.cards).filter(function(k){ return st.cards[k].due <= now && ICA.bankById[k]; }).length;
  /* study streak: days in a row (ending today or yesterday) with a lesson finished */
  var days = {}, DAY = 86400000; Object.keys(st.lessons).forEach(function(k){ var d = st.lessons[k].done; if (d){ var x = new Date(d); days[new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime()] = 1; } });
  var t = ICA.today(), streak = 0, day = days[t] ? t : t - DAY; while (days[day]){ streak++; day -= DAY; }
  $("#notebtn").innerHTML = '<b>Progress</b><span class="st"><span>Lessons</span><span>'+done+' / '+total+'</span></span><span class="st"><span>Streak</span><span>'+(streak ? streak+' day'+(streak === 1 ? '' : 's') : '–')+'</span></span><span class="st"><span>Tracks</span><span>'+(mine.length || 'pick')+'</span></span><small>tap for details</small>';
  $("#cscreen").innerHTML = due ? due+"<br>DUE" : "▶ PLAY";
  today(st, due);
}
/* ---------- Today: Mugi's line and the Quests notebook ---------- */
function nextLesson(st){
  var l = st.last && ICA.lessons[st.last.lesson];
  if (l && !(st.lessons[l.id] || {}).done) return {l:l, resume:true};
  if (!l && st.startAt && ICA.lessons[st.startAt] && !(st.lessons[st.startAt] || {}).done){ var sl = ICA.lessons[st.startAt], su = ICA.unitById[sl.unit];
    var rest = ICA.units.filter(function(u){ return u.track === su.track && u.n >= su.n; });
    for (var r = 0; r < rest.length; r++){ var rl = ICA.unitLessons(rest[r].id); for (var q = 0; q < rl.length; q++) if (!(st.lessons[rl[q].id] || {}).done) return {l:rl[q], resume:false}; } }
  var order = ICA.units.filter(function(u){ return !st.tracks.length || st.tracks.indexOf(u.track) > -1; });
  if (l){ var lu = ICA.unitById[l.unit]; order = [lu].concat(order.filter(function(u){ return u !== lu; })); }
  for (var k = 0; k < order.length; k++){ var ls = ICA.unitLessons(order[k].id); for (var j = 0; j < ls.length; j++) if (!(st.lessons[ls[j].id] || {}).done) return {l:ls[j], resume:false}; }
  return null;
}
function greeting(){ var h = new Date().getHours(); return h < 5 ? "Still up?" : h < 12 ? "Good morning!" : h < 18 ? "Good afternoon!" : "Good evening!"; }
function today(st, due){
  var box = $("#today"), sp = $("#spread"), nx = nextLesson(st), fresh = !st.last && !Object.keys(st.lessons).length;
  if (!nx){
    box.innerHTML = ICA.mugi("yay", '<p><b>'+greeting()+'</b> You’ve finished every lesson on your tracks. Amazing.</p><p class="small">Keep it fresh in the Arcade, or add a track on the Progress note.</p>', {cls:"mpop", say:[greeting(), "You’ve finished every lesson on your tracks. Amazing.", "Keep it fresh in the Arcade, or add a track on the Progress note."]});
    sp.innerHTML = '<div class="pg"><h3>Quests</h3><span class="lt">All done!</span><span class="mt">Every lesson on your tracks</span><a class="cta" href="quests/index.html">All courses →</a></div><div class="pg"><h3>Next</h3><span class="mt">Review in the Arcade</span><span class="mt">or add a track</span></div>';
    return;
  }
  var l = nx.l, u = ICA.unitById[l.unit], tr = ICA.tracks[u.track], ls = st.lessons[l.id] || {};
  var where = nx.resume && ls.card ? "You were partway through, and I saved your place." : nx.resume ? "Pick up where you left off." : "Here’s your next lesson.";
  var say = fresh ? '<p><b>Welcome!</b> Your first lesson is ready whenever you are: about '+l.minutes+' minutes, in short cards.</p>'+(st.welcomed ? '' : '<div class="quick"><button id="othertrack">Run setup</button></div>') : '<p><b>'+greeting()+'</b> '+where+(due ? ' You also have '+due+' flashcard'+(due === 1 ? '' : 's')+' ready in the Arcade.' : '')+'</p>';
  var lines = fresh ? ["Welcome! Your first lesson is ready whenever you are, in short cards."] : [greeting(), where].concat(due ? ["You also have flashcards ready in the Arcade."] : []);
  box.innerHTML = ICA.mugi(fresh ? "hello" : nx.resume ? "tip" : "hello", say, {cls:"mpop", say:lines});
  /* the unit checklist: up to 6 lessons around the current one */
  var all = ICA.unitLessons(u.id), at = all.indexOf(l), from = Math.max(0, Math.min(at - 2, all.length - 6)), shown = all.slice(from, from + 6);
  var list = shown.map(function(x){ var d = (st.lessons[x.id] || {}).done; return '<li class="'+(d ? 'd' : x === l ? 'cur' : '')+'"><a href="quests/index.html#'+x.id+'"><i aria-hidden="true">'+(d ? '✓' : '')+'</i><span>'+esc(x.title)+'</span></a></li>'; }).join("");
  var left = all.length - from - shown.length;
  sp.innerHTML = '<div class="pg"><h3>Quests</h3><span class="mt">'+esc(tr.name)+'</span><span class="mt">Unit '+u.n+' · '+esc(u.title)+'</span><span class="lt">'+esc(l.title)+'</span><span class="mt">About '+l.minutes+' min</span>'+
    '<a class="cta" href="quests/index.html#'+l.id+'">'+(nx.resume ? "Continue" : "Start")+' →</a></div>'+
    '<div class="pg"><h3>This unit</h3><ul class="chk">'+list+(left > 0 ? '<li class="more">+ '+left+' more</li>' : '')+'</ul><a class="all" href="quests/index.html">All courses →</a></div>';
  var ot = $("#othertrack"); if (ot) ot.onclick = welcome;
}

/* ---------- Setup: meet Mugi, pick courses, choose where to start (first visit, or from Settings) ---------- */
var LEVELS = {e3:[["e3u1","From the first kana"],["e3u2","N5 (I know kana)"],["e3u5","N4"],["e3u9","N3"]]};
var TCOL = {t1:"var(--rose)", t2:"var(--lupine)", t3:"var(--gold)", t4:"var(--sage)"};
function trackStats(tid){
  var us = ICA.units.filter(function(u){ return u.track === tid; }), m = 0;
  us.forEach(function(u){ ICA.unitLessons(u.id).forEach(function(l){ m += +l.minutes || 0; }); });
  return {units: us.length, hours: Math.max(1, Math.round(m/60/5)*5)};
}
function firstLesson(uid){ var ls = ICA.unitLessons(uid); return ls.length ? ls[0] : null; }
function setup(){
  var st = ICA.load(), picks = st.tracks.slice(), first = null, lv = {}, step = 1;
  var ov = document.createElement("div"); ov.className = "setup"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Setup");
  document.body.appendChild(ov); document.documentElement.style.overflow = "hidden";
  function close(){ if (ov.parentNode) ov.parentNode.removeChild(ov); document.documentElement.style.overflow = ""; }
  function startOf(tid){ var l = lv[tid] || (LEVELS[tid] ? LEVELS[tid][0][0] : null); var u = l || (ICA.units.filter(function(x){ return x.track === tid; })[0] || {}).id; return u; }
  function render(){
    var body = "", back = '<button class="ghost" data-s="back">‹ Back</button>', next = '<button class="btn primary" data-s="next">Continue →</button>';
    if (step === 1){
      body = '<div class="shi"><small>WELCOME TO</small>IT CHICK Academy</div><div class="smeet"><img src="shared/mascot/full.webp" alt="Mugi, in a cream shirt, knit vest, wide brown trousers and loafers, carrying an IT CHICK tote">'+
        '<div class="sbub"><p>Hello! You can call me <b>Mugi</b>.</p>'+
        '<p>I’ll be your tutor here. IT is my specialty, but I’m curious about almost everything: languages and accents, how societies work, how good research gets done. And stationery. And loafers.</p>'+
        '<p>Let’s make this place yours. It only takes a minute.</p></div></div>'+
        '<p class="small muted" style="text-align:center;margin:0">Coming back on a new device? <button class="linkbtn" data-s="restore">Restore a backup</button></p>';
      back = '<button class="ghost" data-s="skip">Skip for now</button>'; next = '<button class="btn primary" data-s="next">Let’s set up →</button>';
    } else if (step === 2){
      var row = function(id){ var t = ICA.tracks[id], s = trackStats(id), on = picks.indexOf(id) > -1;
        return '<button class="str" data-t="'+id+'" aria-pressed="'+on+'" style="--c:'+(TCOL[id] || "var(--plum, #7a2d3a)")+'"><span class="ic" aria-hidden="true">'+t.icon+'</span><b>'+esc(t.name)+'</b><span class="ck" aria-hidden="true">'+(on ? "✓" : "")+'</span><span class="d">'+esc(t.blurb)+' <span class="m">'+s.units+' units · about '+s.hours+' h</span></span></button>'; };
      var ids = trackIds().filter(hasUnits), core = ids.filter(function(i){ return i.charAt(0) === "t"; }), el = ids.filter(function(i){ return i.charAt(0) !== "t"; });
      body = '<div class="ssay"><img src="shared/mascot/tip.webp" alt=""><p>This is everything I teach here. Choose whatever catches your eye. Nothing is set in stone, so you can always add more later.</p></div>'+
        '<div class="sgrp">Core skills</div>'+core.map(row).join("")+'<div class="sgrp">Electives</div>'+el.map(row).join("");
      if (!picks.length) next = '<button class="btn primary" data-s="next" disabled>Pick at least one</button>';
    } else if (step === 3){
      if (!first || picks.indexOf(first) < 0) first = picks[0];
      body = '<div class="ssay"><img src="shared/mascot/think.webp" alt=""><p>'+(picks.length > 1 ? 'Lovely choices. Which one shall we open first? I’ll keep the others close by.' : 'Lovely choice. Where shall we begin?')+'</p></div>'+
        picks.map(function(id){ var t = ICA.tracks[id], on = id === first, u = ICA.unitById[startOf(id)];
          var h = '<button class="sopt" role="radio" data-f="'+id+'" aria-checked="'+on+'"><span class="rd" aria-hidden="true"></span><b>'+t.icon+' '+esc(t.name)+'</b><span class="d">Starts with Unit '+u.n+' · '+esc(u.title)+'</span></button>';
          if (LEVELS[id] && on) h += '<div class="slv" role="group" aria-label="Starting level">'+LEVELS[id].map(function(x){ return '<button class="schip" data-lv="'+id+'|'+x[0]+'" aria-pressed="'+(startOf(id) === x[0])+'">'+x[1]+'</button>'; }).join("")+'</div>';
          return h; }).join("")+
        '<div class="ssay" style="margin-top:auto"><img src="shared/mascot/hello.webp" alt=""><p>If you already know some of this, start further in. We can always go back and review together.</p></div>';
    } else {
      var l = firstLesson(startOf(first)), u = ICA.unitById[l.unit];
      body = '<div class="sdone"><img src="shared/mascot/yay.webp" alt="Mugi cheering"><div class="ssay up"><p><b>You’re all set!</b> Your desk is ready, and I’ve left your first lesson open for you. Shall we begin?</p></div>'+
        '<div class="sfirst"><span class="small muted">'+esc(ICA.tracks[first].name)+' · Unit '+u.n+'</span><b>'+esc(l.title)+'</b><span class="small muted">About '+l.minutes+' min, in short cards</span></div>'+
        '<p class="small muted">Change your courses or run this again from ⚙︎ Settings.</p></div>';
      next = '<button class="btn primary" data-s="done">Go to my desk →</button>';
    }
    ov.innerHTML = '<div class="sdots" aria-hidden="true">'+[1,2,3,4].map(function(i){ return '<i'+(i === step ? ' class="on"' : '')+'></i>'; }).join("")+'</div>'+
      '<div class="sbody"><div class="sin">'+body+'</div></div><div class="sfoot"><div class="in">'+back+next+'</div></div>';
    ov.querySelector(".sbody").scrollTop = 0;
    var f = ov.querySelector('[data-s="next"],[data-s="done"]'); if (f && step === 1) f.focus();
  }
  ov.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.t){ var i = picks.indexOf(b.dataset.t); if (i > -1) picks.splice(i, 1); else picks.push(b.dataset.t); render(); return; }
    if (b.dataset.f){ first = b.dataset.f; render(); return; }
    if (b.dataset.lv){ var p = b.dataset.lv.split("|"); lv[p[0]] = p[1]; render(); return; }
    var s = b.dataset.s;
    if (s === "restore"){ close(); ICA.settingsSheet({progress:progressSheet, after:refreshDesk, setup:function(){ ICA.closeSheet(); setup(); }, openRestore:true}); var rf = document.getElementById("restfile"); if (rf) rf.focus(); return; }
    if (s === "skip"){ var x = ICA.load(); x.welcomed = true; if (!x.tracks.length) x.tracks = ["t1"]; ICA.save(); close(); refreshDesk(); }
    else if (s === "back"){ step = Math.max(1, step - 1); render(); }
    else if (s === "next"){ step++; render(); }
    else if (s === "done"){
      var y = ICA.load(), l = firstLesson(startOf(first));
      y.tracks = picks.slice(); y.welcomed = true; y.startAt = l.id;
      /* the chosen course comes first */
      y.tracks.sort(function(a, b){ return (a === first ? -1 : 0) - (b === first ? -1 : 0); });
      if (y.last && !(y.lessons[y.last.lesson] || {}).learn && !(y.lessons[y.last.lesson] || {}).done) delete y.last;
      ICA.save(); close(); refreshDesk();
    }
  });
  ov.addEventListener("keydown", function(e){ if (e.key === "Escape" && step === 1){ ov.querySelector('[data-s="skip"]').click(); } });
  render();
}
function welcome(){ setup(); }
function trackPicker(){
  var st = ICA.load();
  return '<div class="trackpick">'+trackIds().map(function(id){ var t = ICA.tracks[id], ready = hasUnits(id); return '<label><input type="checkbox" data-track="'+id+'"'+(st.tracks.indexOf(id) > -1 ? " checked" : "")+(ready ? "" : " disabled")+'><span><b>'+t.icon+' '+esc(t.name)+'</b>'+(t.elective ? ' <span class="chip">Elective</span>' : '')+'<br><span class="small muted">'+esc(ready ? t.blurb : t.soon)+'</span></span></label>'; }).join("")+'</div>';
}
function saveTracks(sh){
  var st = ICA.load(); st.tracks = ICA.$$("[data-track]", sh).filter(function(i){ return i.checked; }).map(function(i){ return i.getAttribute("data-track"); }); ICA.save();
}

/* ---------- Progress: tracks, lessons done, bars and stats (no settings) ---------- */
function progressSheet(){
  var st = ICA.load(), reps = st.reports.slice().reverse();
  var doneAll = 0, totalAll = 0;
  var tracks = trackIds().filter(hasUnits).map(function(tid){
    var t = ICA.tracks[tid], us = ICA.units.filter(function(u){ return u.track === tid; }), d = 0, n = 0;
    var rows = us.map(function(u){ var p = ICA.unitProgress(u.id); d += p.done; n += p.total; return '<div><div class="spread small"><span>Unit '+u.n+' · '+esc(u.title)+'</span><span>'+p.done+'/'+p.total+'</span></div><div class="bar"><i style="width:'+(p.total?p.done/p.total*100:0)+'%"></i></div></div>'; }).join("");
    doneAll += d; totalAll += n; var mine = st.tracks.indexOf(tid) > -1;
    return '<details class="ptrack"'+(mine && d ? " open" : "")+'><summary><span class="pt"><span class="chev" aria-hidden="true">▸</span> <b>'+t.icon+' '+esc(t.name)+'</b>'+(mine ? ' <span class="chip">My track</span>' : '')+'</span><span class="small">'+d+'/'+n+'</span><span class="bar"><i style="width:'+(n?d/n*100:0)+'%"></i></span></summary><div class="stack" style="gap:8px;margin-top:8px">'+rows+'</div></details>';
  }).join("");
  var known = Object.keys(st.cards).filter(function(k){ return st.cards[k].box >= 3; }).length, inReview = Object.keys(st.cards).length;
  var now = Date.now(), due = Object.keys(st.cards).filter(function(k){ return st.cards[k].due <= now; }).length;
  var kl = (st.labs && st.labs.kanji && st.labs.kanji.c) ? Object.keys(st.labs.kanji.c).length : 0;
  function stat(n, l){ return '<div class="pstat"><b>'+n+'</b><span>'+l+'</span></div>'; }
  ICA.sheet('<div class="eyebrow">Progress</div><h2>How you’re doing</h2>'+
    '<div class="pstats">'+stat(doneAll+'<small>/'+totalAll+'</small>', 'lessons done')+stat(inReview, 'flashcards in review')+stat(known, 'cards known well')+stat(due, 'cards due now')+(kl ? stat(kl, 'Kanji Lab cards') : '')+'</div>'+
    '<h3>Tracks</h3><div class="stack" style="gap:8px">'+tracks+'</div>'+
    '<details><summary><b>Choose my tracks</b></summary><div style="margin-top:8px">'+trackPicker()+'</div></details>'+
    '<h3>Mistake notes</h3>'+(reps.length ? '<p class="small muted">Notes you saved with “Report a mistake”. Copy them to send to whoever maintains the academy.</p><ul class="notes small">'+reps.map(function(r){ return '<li><b>'+esc(r.where)+'</b>: '+esc(r.note)+' <span class="muted">('+new Date(r.ts).toLocaleDateString()+')</span></li>'; }).join("")+'</ul><div class="row"><button class="btn small" id="copyrep">Copy all notes</button><button class="btn small ghost" id="clearrep">Clear notes</button></div><div id="clearconfirm"></div>' : '<p class="small muted">No notes yet. Every lesson and Codex entry has a “Report a mistake” link.</p>')+
    '<div class="row"><button class="btn small ghost" id="gosettings">⚙︎ Settings and backup</button></div>', function(sh){
    sh.setAttribute("aria-label", "Progress"); sh.id = "progresspanel";
    sh.addEventListener("change", function(e){ if (e.target.closest("[data-track]")){ saveTracks(sh); refreshDesk(); } });
    var cr = sh.querySelector("#copyrep"); if (cr) cr.onclick = function(){ ICA.copy(st.reports.map(function(r){ return "• "+r.where+": "+r.note+" ("+new Date(r.ts).toISOString().slice(0,10)+")"; }).join("\n"), function(ok){ ICA.toast(ok ? "Copied" : "Couldn’t copy. Select the notes and copy them yourself."); }); };
    var cl = sh.querySelector("#clearrep"); if (cl) cl.onclick = function(){ sh.querySelector("#clearconfirm").innerHTML = '<div class="card row"><span>Delete all '+st.reports.length+' notes?</span><button class="btn small primary" id="yesclear">Delete</button></div>'; sh.querySelector("#yesclear").onclick = function(){ st.reports = []; ICA.save(); progressSheet(); }; };
    sh.querySelector("#gosettings").onclick = settingsSheet;
  });
}

function settingsSheet(){ ICA.settingsSheet({progress:progressSheet, after:refreshDesk, setup:function(){ ICA.closeSheet(); setup(); }}); }

document.getElementById("notebtn").addEventListener("click", progressSheet);
document.getElementById("settingsbtn").addEventListener("click", settingsSheet);

ICA.loadAll("./", function(){
  refreshDesk();
  var st = ICA.load();
  if (location.hash === "#setup" || (!st.welcomed && !st.last && !Object.keys(st.lessons).length)){ if (location.hash) history.replaceState(null, "", location.pathname); setup(); }
});
})();
</script>
</body>
