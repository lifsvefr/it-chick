<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2419">
<title>IT CHICK Academy</title>
<meta name="description" content="A free learning ecosystem for digital, data and research skills, starting from zero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<script src="shared/catalog.js"></script>
<script src="shared/engine.js"></script>
<style>
/* The hub: a top-down study desk. Every object is a link to an app. */
.hubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:10px}
.hubhead h1{color:var(--espresso)}
.cont{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.cont:hover{border-color:var(--rose)}
.desk{position:relative;border-radius:22px;padding:22px 18px 26px;background:var(--wood1);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 19px,rgba(255,255,255,.03) 19px 21px,transparent 21px 47px),linear-gradient(180deg,var(--wood1),var(--wood2));box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),var(--shadow);display:grid;gap:22px 16px;
  grid-template-columns:1fr 1fr;grid-template-areas:"laptop laptop" "quests codex" "arcade note" "forge mug"}
@media (min-width:720px){.desk{grid-template-columns:1fr 1.5fr 1fr;grid-template-areas:"note laptop codex" "quests arcade forge" "quests mug forge";padding:30px 26px 34px}}
.obj{position:relative;display:grid;gap:8px;justify-items:center;align-content:start;text-decoration:none;color:var(--ink);border:0;background:none;padding:0;font:inherit;cursor:pointer}
.obj .art{position:relative;width:100%;transition:transform .18s ease}
.obj:hover .art,.obj:focus-visible .art{transform:translateY(-4px) rotate(var(--tilt,0deg))}
.obj:focus-visible{outline:none}
.obj:focus-visible .tag{outline:3px solid #fff;outline-offset:2px}
.tag{background:#fffaf2;color:#2b1c16;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center;line-height:1.3}
.tag small{display:block;font-weight:400;color:#6a5549;font-size:11.5px}
.soon{position:absolute;top:-8px;right:-4px;background:#e9d58a;color:#3b2419;font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;transform:rotate(6deg);box-shadow:0 2px 0 rgba(0,0,0,.2)}
/* laptop */
.a-laptop{grid-area:laptop;--tilt:-1deg}
.lap-screen{background:#232733;border:9px solid #3a3f4d;border-radius:12px 12px 4px 4px;aspect-ratio:16/9.5;padding:8%;display:grid;align-content:start;gap:7%}
.lap-screen i{display:block;height:7px;border-radius:4px;opacity:.85}
.lap-base{height:14px;background:linear-gradient(#cfd2da,#a9adb8);border-radius:0 0 14px 14px;margin:0 -5%;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.cursor{width:9px;height:14px;background:#e69aa3;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* codex book */
.a-codex{grid-area:codex;--tilt:2deg}
.book{aspect-ratio:3/4;max-width:200px;margin:0 auto;background:#efe4cf;border-radius:4px 10px 10px 4px;box-shadow:inset 14px 0 0 #8f6ca8,inset 17px 0 0 rgba(0,0,0,.15),0 6px 0 #d8c8ad,0 8px 0 rgba(0,0,0,.25);transform:rotate(3deg);display:grid;place-items:center;position:relative}
.book .ttl{font-family:var(--display);font-weight:800;color:#5a4180;font-size:clamp(16px,3.4vw,22px);letter-spacing:.14em;border-top:2px solid #5a4180;border-bottom:2px solid #5a4180;padding:4px 6px;margin-left:12px}
.book .ribbon{position:absolute;bottom:-14px;right:22%;width:12px;height:30px;background:#c46773;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
/* quests notebook */
.a-quests{grid-area:quests;--tilt:-2deg}
.notebook{aspect-ratio:3/4.1;max-width:210px;margin:0 auto;background:#d98f98;border-radius:6px 12px 12px 6px;transform:rotate(-3deg);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.notebook:before{content:"";position:absolute;left:8px;top:6%;bottom:6%;width:12px;background:radial-gradient(circle at 6px 6px,#f1e8dc 4px,transparent 5px) 0 0/12px 18px}
.notebook .lbl{background:#fffaf2;padding:8px 12px;border-radius:4px;text-align:center;margin-left:16px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.notebook .lbl b{display:block;font-family:var(--display);color:#3b2419;font-size:clamp(15px,3.2vw,19px)}
.notebook .lbl span{font-size:11.5px;color:#6a5549}
/* arcade console */
.a-arcade{grid-area:arcade;--tilt:2deg}
.console{aspect-ratio:1.55/1;max-width:250px;margin:0 auto;background:#9a85cf;border-radius:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.28);display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:0 6%;transform:rotate(2deg)}
.dpad{width:42px;height:42px;justify-self:center;background:linear-gradient(#2b2440,#2b2440) center/14px 100% no-repeat,linear-gradient(#2b2440,#2b2440) center/100% 14px no-repeat}
.cscreen{background:#cfe0b7;border:6px solid #3d3456;border-radius:8px;aspect-ratio:1.3/1;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:#2f3d27;font-weight:600;text-align:center;line-height:1.2;padding:2px}
.abtn{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-self:center}
.abtn i{width:16px;height:16px;border-radius:50%;background:#e69aa3;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.abtn i+i{background:#f0d27a;transform:translateY(-8px)}
/* forge printer */
.a-forge{grid-area:forge;--tilt:-1deg}
.printer{max-width:200px;margin:0 auto;position:relative;padding-top:24%}
.paper{position:absolute;top:0;left:22%;right:22%;height:44%;background:#fffaf2;border-radius:3px;background-image:repeating-linear-gradient(#fffaf2 0 9px,#d9cdbd 9px 10px)}
.pbody{position:relative;background:#e3dccf;border-radius:12px;aspect-ratio:2/1;box-shadow:inset 0 -8px 0 #cfc6b6,0 6px 0 rgba(0,0,0,.25)}
.pbody:after{content:"";position:absolute;left:12%;right:12%;top:22%;height:10px;background:#3b2419;border-radius:5px;opacity:.7}
.pbody:before{content:"";position:absolute;right:12%;bottom:26%;width:10px;height:10px;border-radius:50%;background:#7fbf6a}
/* sticky note */
.a-note{grid-area:note;--tilt:3deg}
.sticky{background:#f3dd84;aspect-ratio:1/1;max-width:190px;margin:0 auto;padding:12px 12px 10px;transform:rotate(-4deg);box-shadow:0 8px 10px -6px rgba(0,0,0,.45);font-family:"Caveat",var(--body);color:#3b2a10;font-size:clamp(16px,3.6vw,20px);line-height:1.15;display:grid;align-content:start;gap:4px;text-align:left;overflow:hidden}
.sticky b{font-size:1.15em}
/* mug */
.a-mug{grid-area:mug;align-self:center;justify-self:center;width:90px;pointer-events:none}
.mug{position:relative;width:76px;height:76px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3b2014 0 24px,#efe6da 25px 33px,rgba(0,0,0,.15) 34px,transparent 36px)}
.mug:after{content:"";position:absolute;right:-10px;top:28px;width:18px;height:18px;border:6px solid #efe6da;border-radius:50%;border-left-color:transparent}
.steam{position:absolute;left:30px;top:-6px;width:14px;height:30px;border-left:3px solid rgba(255,255,255,.45);border-radius:50%;animation:steam 3s ease-in-out infinite}
.steam+.steam{left:40px;animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.hint{text-align:center;color:var(--soft);font-size:.9em;margin-top:10px}
/* progress sheet */
.trackpick{display:grid;gap:8px}
.trackpick label{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trackpick input{width:20px;height:20px;margin-top:3px;accent-color:var(--rose)}
.seg3{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{border:0;background:var(--panel);padding:7px 12px;font-weight:700;font-size:.9em}
.seg3 button[aria-pressed="true"]{background:var(--espresso);color:var(--bg)}
.notes li{margin:6px 0}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="hubhead">
    <div><div class="eyebrow">Your study desk</div><h1>IT CHICK Academy</h1></div>
    <button class="iconbtn" id="settingsbtn" aria-label="Progress and settings">⚙︎</button>
  </div>
  <section class="today" id="today" aria-live="polite"></section>
  <div class="deskhead" id="deskhead"><h2 style="margin:0;font-size:1.15em">Your desk</h2><span class="small muted">everything else lives here</span></div>
  <nav class="desk" id="desk" aria-label="Academy apps">
    <a class="obj a-laptop" href="labs/index.html" aria-label="Labs, hands-on sandboxes">
      <div class="art"><div class="lap-screen" aria-hidden="true"><i style="width:55%;background:#b6a4ea"></i><i style="width:80%;background:#e69aa3"></i><i style="width:40%;background:#abc795"></i><i style="width:65%;background:#e3bb6c"></i><span class="cursor"></span></div><div class="lap-base" aria-hidden="true"></div></div>
      <span class="tag">Labs<small>hands-on sandboxes</small></span>
    </a>
    <a class="obj a-codex" href="codex/index.html" aria-label="Codex, the library">
      <div class="art"><div class="book" aria-hidden="true"><span class="ttl">CODEX</span><span class="ribbon"></span></div></div>
      <span class="tag">Codex<small>look anything up</small></span>
    </a>
    <a class="obj a-quests" href="quests/index.html" aria-label="Quests, your courses">
      <div class="art"><div class="notebook" aria-hidden="true"><div class="lbl"><b>Quests</b><span id="qprog">your courses</span></div></div></div>
      <span class="tag">Quests<small>learn step by step</small></span>
    </a>
    <a class="obj a-arcade" href="arcade/index.html" aria-label="Arcade, practice games">
      <div class="art"><div class="console" aria-hidden="true"><span class="dpad"></span><span class="cscreen" id="cscreen">▶ PLAY</span><span class="abtn"><i></i><i></i></span></div></div>
      <span class="tag">Arcade<small>practice games</small></span>
    </a>
    <a class="obj a-forge" href="forge/index.html" aria-label="Forge, printables">
      <div class="art"><div class="printer" aria-hidden="true"><div class="paper"></div><div class="pbody"></div></div></div>
      <span class="tag">Forge<small>printables</small></span>
    </a>
    <button class="obj a-note" id="notebtn" aria-label="Your progress and settings">
      <div class="art"><div class="sticky" id="sticky" aria-hidden="true"><b>My desk</b><span>Tap to choose tracks</span></div></div>
      <span class="tag">Progress<small>tracks · settings · backup</small></span>
    </button>
    <div class="obj a-mug" aria-hidden="true"><div class="mug"><span class="steam"></span><span class="steam"></span></div></div>
  </nav>
  <p class="hint">Tap anything on the desk.</p>
</main>
<script>
(function(){
var esc = ICA.esc, md = ICA.md, $ = ICA.$;

function trackIds(){ return Object.keys(ICA.tracks).sort(function(a,b){ return ICA.tracks[a].n - ICA.tracks[b].n; }); }
function hasUnits(tid){ return ICA.units.some(function(u){ return u.track === tid; }); }

function refreshDesk(){
  var st = ICA.load();
  /* sticky note */
  var mine = st.tracks.filter(function(t){ return ICA.tracks[t]; });
  var done = Object.keys(st.lessons).filter(function(k){ return st.lessons[k].done && ICA.lessons[k]; }).length;
  $("#sticky").innerHTML = mine.length ? "<b>My tracks</b>"+mine.map(function(t){ return "<span>· "+esc(ICA.tracks[t].name)+"</span>"; }).join("")+"<span>Lessons done: "+done+"</span>" : "<b>My desk</b><span>Tap here to choose your tracks</span>";
  /* notebook */
  var total = Object.keys(ICA.lessons).length;
  $("#qprog").textContent = total ? done+" of "+total+" lessons" : "your courses";
  /* console */
  var now = Date.now(), due = Object.keys(st.cards).filter(function(k){ return st.cards[k].due <= now && ICA.bankById[k]; }).length;
  $("#cscreen").innerHTML = due ? due+"<br>CARD"+(due===1?"":"S")+"<br>READY" : "▶ PLAY";
  today(st, due);
}
/* ---------- Today: one clear next step, from Mugi ---------- */
function nextLesson(st){
  var l = st.last && ICA.lessons[st.last.lesson];
  if (l && !(st.lessons[l.id] || {}).done) return {l:l, resume:true};
  var order = ICA.units.filter(function(u){ return !st.tracks.length || st.tracks.indexOf(u.track) > -1; });
  if (l){ var lu = ICA.unitById[l.unit]; order = [lu].concat(order.filter(function(u){ return u !== lu; })); }
  for (var k = 0; k < order.length; k++){ var ls = ICA.unitLessons(order[k].id); for (var j = 0; j < ls.length; j++) if (!(st.lessons[ls[j].id] || {}).done) return {l:ls[j], resume:false}; }
  return null;
}
function greeting(){ var h = new Date().getHours(); return h < 5 ? "Still up?" : h < 12 ? "Good morning!" : h < 18 ? "Good afternoon!" : "Good evening!"; }
function today(st, due){
  var box = $("#today"), nx = nextLesson(st), fresh = !st.last && !Object.keys(st.lessons).length;
  var deskShown = !fresh || st.showDesk;
  $("#desk").hidden = !deskShown; $("#deskhead").hidden = !deskShown; var hint = document.querySelector(".hint"); if (hint) hint.hidden = !deskShown;
  if (!nx){ box.innerHTML = ICA.mugi("yay", '<p><b>'+greeting()+'</b> You’ve finished every lesson on your tracks. Amazing.</p><p class="small">Keep it fresh in the Arcade, or add another track from the sticky note.</p>', {cls:"mpop"}); return; }
  var l = nx.l, u = ICA.unitById[l.unit], t = ICA.tracks[u.track], ls = st.lessons[l.id] || {};
  var where = nx.resume && ls.card ? "You were partway through. I saved your place." : nx.resume ? "Pick up where you left off." : "Here’s your next lesson.";
  var say = fresh ? '<p><b>Hi, I’m Mugi!</b> I’ll learn with you. Let’s start small: one lesson, about '+l.minutes+' minutes, in short cards.</p>' : '<p><b>'+greeting()+'</b> '+where+'</p>';
  box.innerHTML = ICA.mugi(fresh ? "hello" : nx.resume ? "tip" : "hello", say, {cls:"mpop"}) +
    '<a class="nextup" href="quests/index.html#'+l.id+'"><span><span class="small muted">'+esc(t.name)+' · Unit '+u.n+'</span><b>'+esc(l.title)+'</b><span class="small muted">About '+l.minutes+' min</span></span><span class="go">'+(nx.resume ? "Continue" : "Start")+' →</span></a>' +
    '<div class="quick">'+(due ? '<a href="arcade/index.html">🎴 '+due+' flashcard'+(due === 1 ? '' : 's')+' ready</a>' : '')+(fresh ? '<button id="othertrack">Show me other tracks</button><button id="showdesk">Explore everything</button>' : '<a href="quests/index.html">All courses</a><a href="labs/index.html">🧪 Labs</a>')+'</div>';
  var ot = $("#othertrack"); if (ot) ot.onclick = welcome;
  var sd = $("#showdesk"); if (sd) sd.onclick = function(){ var s2 = ICA.load(); s2.showDesk = true; ICA.save(); refreshDesk(); $("#desk").scrollIntoView({behavior:"smooth"}); };
}

function welcome(){
  ICA.sheet(ICA.mugi("hello", '<p><b>Which tracks do you want?</b> Pick as many as you like. You can change this any time on the sticky note.</p>')+trackPicker()+'<p class="small muted">Your progress stays on this device only.</p><div class="row"><button class="btn primary" id="wdone">Done</button></div>', function(sh){
    sh.querySelector("#wdone").addEventListener("click", function(){ saveTracks(sh); var st = ICA.load(); st.welcomed = true; ICA.save(); ICA.closeSheet(); refreshDesk(); });
  });
}
function trackPicker(){
  var st = ICA.load();
  return '<div class="trackpick">'+trackIds().map(function(id){ var t = ICA.tracks[id], ready = hasUnits(id); return '<label><input type="checkbox" data-track="'+id+'"'+(st.tracks.indexOf(id) > -1 ? " checked" : "")+(ready ? "" : " disabled")+'><span><b>'+t.icon+' '+esc(t.name)+'</b>'+(t.elective ? ' <span class="chip">Elective</span>' : '')+'<br><span class="small muted">'+esc(ready ? t.blurb : t.soon)+'</span></span></label>'; }).join("")+'</div>';
}
function saveTracks(sh){
  var st = ICA.load(); st.tracks = ICA.$$("[data-track]", sh).filter(function(i){ return i.checked; }).map(function(i){ return i.getAttribute("data-track"); }); ICA.save();
}

function progressSheet(){
  var st = ICA.load(), s = st.settings;
  var units = ICA.units.map(function(u){ var p = ICA.unitProgress(u.id); return '<div><div class="spread small"><span>'+esc(ICA.tracks[u.track].name)+' · '+esc(u.title)+'</span><span>'+p.done+'/'+p.total+'</span></div><div class="bar"><i style="width:'+(p.total?p.done/p.total*100:0)+'%"></i></div></div>'; }).join("");
  var known = Object.keys(st.cards).filter(function(k){ return st.cards[k].box >= 3; }).length, inReview = Object.keys(st.cards).length;
  var reps = st.reports.slice().reverse();
  function seg(name, opts, cur){ return '<div class="seg3" role="group" aria-label="'+name+'">'+opts.map(function(o){ return '<button data-set="'+name+'" data-val="'+o[0]+'" aria-pressed="'+(o[0]===cur)+'">'+o[1]+'</button>'; }).join("")+'</div>'; }
  ICA.sheet('<div class="eyebrow">Progress</div><h2>Your desk</h2>'+
    '<h3>Your tracks</h3>'+trackPicker()+
    '<h3>Progress</h3><div class="stack">'+units+'<p class="small muted">Flashcards in review: '+inReview+' · known well: '+known+'</p></div>'+
    '<h3>Display</h3><div class="stack"><div class="spread"><span>Theme</span>'+seg("theme",[["system","Auto"],["light","Light"],["dark","Dark"]],s.theme)+'</div><div class="spread"><span>Text size</span>'+seg("size",[["small","Smaller"],["normal","Normal"],["large","Larger"]],s.size)+'</div></div>'+
    '<h3>Mistake notes</h3>'+(reps.length ? '<p class="small muted">Notes you saved with “Report a mistake”. Copy them to send to whoever maintains the academy.</p><ul class="notes small">'+reps.map(function(r){ return '<li><b>'+esc(r.where)+'</b>: '+esc(r.note)+' <span class="muted">('+new Date(r.ts).toLocaleDateString()+')</span></li>'; }).join("")+'</ul><div class="row"><button class="btn small" id="copyrep">Copy all notes</button><button class="btn small ghost" id="clearrep">Clear notes</button></div><div id="clearconfirm"></div>' : '<p class="small muted">No notes yet. Every lesson and Codex entry has a “Report a mistake” link.</p>')+
    '<h3>Backup</h3><p class="small muted">Progress is saved in this browser only. A backup lets you move it to another device or keep it safe.</p><div class="row"><button class="btn small" id="dl">Download backup</button><button class="btn small" id="cp">Copy backup</button></div>'+
    '<details><summary class="small"><b>Restore from a backup</b></summary><div class="stack" style="margin-top:8px"><label class="lb" for="restfile">Choose a backup file</label><input type="file" id="restfile" accept=".json,application/json"><label class="lb" for="resttext">…or paste backup text</label><textarea id="resttext" placeholder="{ &quot;v&quot;: 1, … }"></textarea><button class="btn small" id="restore">Restore</button><div id="restmsg"></div></div></details>'+
    '<h3>Start over</h3><p class="small muted">Erase everything on this device: lessons, quiz scores, flashcards, notes, Formula Lab, tracks and settings. This can’t be undone, so download a backup first if you might want it back.</p><div class="row"><button class="btn small" id="erase">Erase all progress…</button></div><div id="eraseconfirm"></div>'+
    '<p class="small muted">Version: Pass 14 · All content complete: four tracks, two electives, five labs · Forge · Mugi.</p>', function(sh){
    sh.addEventListener("change", function(e){ if (e.target.closest("[data-track]")){ saveTracks(sh); refreshDesk(); } });
    sh.addEventListener("click", function(e){
      var b = e.target.closest("[data-set]");
      if (b){ st.settings[b.getAttribute("data-set")] = b.getAttribute("data-val"); ICA.save(); ICA.applySettings(); ICA.$$('[data-set="'+b.getAttribute("data-set")+'"]', sh).forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); }
    });
    var cr = sh.querySelector("#copyrep"); if (cr) cr.onclick = function(){ ICA.copy(st.reports.map(function(r){ return "• "+r.where+": "+r.note+" ("+new Date(r.ts).toISOString().slice(0,10)+")"; }).join("\n"), function(ok){ ICA.toast(ok ? "Copied" : "Couldn’t copy. Select the notes and copy them yourself."); }); };
    var cl = sh.querySelector("#clearrep"); if (cl) cl.onclick = function(){ sh.querySelector("#clearconfirm").innerHTML = '<div class="card row"><span>Delete all '+st.reports.length+' notes?</span><button class="btn small primary" id="yesclear">Delete</button></div>'; sh.querySelector("#yesclear").onclick = function(){ st.reports = []; ICA.save(); progressSheet(); }; };
    sh.querySelector("#erase").onclick = function(){
      var box = sh.querySelector("#eraseconfirm");
      box.innerHTML = '<div class="card stack" style="border-color:var(--bad)"><b>Erase all progress on this device?</b><span class="small">You’ll start fresh, as if opening IT CHICK Academy for the first time.</span><div class="row"><button class="btn small" id="erasecancel">Keep my progress</button><button class="btn small primary" id="eraseyes" style="background:var(--bad);border-color:var(--bad)">Yes, erase everything</button></div></div>';
      sh.querySelector("#erasecancel").onclick = function(){ box.innerHTML = ""; };
      sh.querySelector("#eraseyes").onclick = function(){ ICA.eraseAll(); ICA.applySettings(); ICA.closeSheet(); window.scrollTo(0, 0); refreshDesk(); ICA.toast("All progress erased. Fresh start!"); };
    };
    sh.querySelector("#dl").onclick = function(){ var ok = ICA.download("itchick-backup-"+new Date().toISOString().slice(0,10)+".json", ICA.exportText()); ICA.toast(ok ? "Backup downloaded" : "Download isn’t available here. Use Copy backup."); };
    sh.querySelector("#cp").onclick = function(){ ICA.copy(ICA.exportText(), function(ok){ ICA.toast(ok ? "Backup copied. Paste it somewhere safe." : "Couldn’t copy here."); }); };
    function tryRestore(text){
      var msg = sh.querySelector("#restmsg"), obj;
      try { obj = JSON.parse(text); } catch(err){ msg.innerHTML = '<div class="fb no"><b>That isn’t a backup.</b>The text couldn’t be read. Check that you pasted all of it, from the first { to the last }.</div>'; return; }
      if (!obj || obj.v !== 1 || typeof obj.lessons !== "object"){ msg.innerHTML = '<div class="fb no"><b>That isn’t an IT CHICK Academy backup.</b>It’s missing the parts a backup always has.</div>'; return; }
      msg.innerHTML = '<div class="card stack"><span>This replaces the progress on this device with the backup. Continue?</span><div class="row"><button class="btn small primary" id="yesrest">Replace my progress</button></div></div>';
      sh.querySelector("#yesrest").onclick = function(){ ICA.replaceStore(obj); ICA.applySettings(); ICA.closeSheet(); refreshDesk(); ICA.toast("Backup restored"); };
    }
    sh.querySelector("#restore").onclick = function(){
      var f = sh.querySelector("#restfile").files[0], txt = sh.querySelector("#resttext").value.trim();
      if (f){ var r = new FileReader(); r.onload = function(){ tryRestore(String(r.result)); }; r.readAsText(f); }
      else if (txt) tryRestore(txt);
      else sh.querySelector("#restmsg").innerHTML = '<div class="fb part"><b>Nothing to restore yet.</b>Choose a file or paste backup text first.</div>';
    };
  });
}

document.getElementById("notebtn").addEventListener("click", progressSheet);
document.getElementById("settingsbtn").addEventListener("click", progressSheet);

ICA.loadAll("./", function(){
  refreshDesk();
});
})();
</script>
