<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2419">
<title>Web Lab · IT CHICK Academy</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../shared/icons/favicon.png">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="IT CHICK">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css?v=28">
<script src="../shared/engine.js?v=28"></script>
<script src="../shared/weblab.js"></script>
<script src="../data/lab-web.js"></script>
<style>
.groups{display:grid;gap:14px}
.grp h2{font-size:1.15em;margin:0}
.grp p{margin:2px 0 8px}
.chal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chal a{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;color:var(--ink);text-decoration:none;font-size:.95em;line-height:1.3}
.chal a:hover{border-color:var(--lupine)}
.chal a.done{border-color:var(--ok);background:var(--okTint)}
.chal .n{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:18px}
.paneTabs{display:flex;gap:6px;flex-wrap:wrap}
.paneTabs button{font-family:var(--mono);font-size:13px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;color:var(--ink)}
.paneTabs button[aria-pressed="true"]{background:var(--espresso);color:var(--bg);border-color:var(--espresso)}
.paneTabs button .ro{font-size:10px;opacity:.75;margin-left:4px}
.editor{width:100%;min-height:200px;font-family:var(--mono);font-size:15px;line-height:1.5;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);tab-size:2;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere}
.editor:focus{outline:none;border-color:var(--lupine)}
.editor[readonly]{background:var(--panel2);color:var(--soft)}
.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.keys button{font-family:var(--mono);font-size:15px;padding:7px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.previewbox{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.previewbox .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--panel2);font-family:var(--mono);font-size:11px;color:var(--soft);border-bottom:1px solid var(--line)}
.previewbox iframe{display:block;width:100%;height:220px;border:0;background:#fff}
#checkframe{position:absolute;left:-10000px;top:0;width:600px;height:700px;border:0;visibility:hidden}
.fb{border-radius:12px;padding:11px 14px;border-left:4px solid var(--line);background:var(--panel2)}
.fb.ok{border-color:var(--ok);background:var(--okTint)}
.fb.bad{border-color:var(--rose);background:var(--roseTint)}
.fb .h{display:block;font-family:var(--display);font-size:1.08em;margin-bottom:4px}
.fb ul{margin:6px 0;padding-left:0;list-style:none;display:grid;gap:6px}
.fb li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px}
.fb li .why{grid-column:2;font-size:.92em}
.lint{display:grid;gap:6px;margin:6px 0}
.lint button{text-align:left;font:inherit;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:8px;padding:7px 10px;color:var(--ink)}
.lint button.soft{border-left-color:var(--gold)}
.lint b{font-family:var(--mono);font-size:12px}
.console{font-family:var(--mono);font-size:12.5px;background:#1f1a17;color:#f3e9d6;border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto}
.row.wrapbtns{flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Loading…</p></main>
<iframe id="checkframe" title="Checker (hidden)" sandbox="allow-scripts allow-same-origin" aria-hidden="true" tabindex="-1"></iframe>
<script>
(function(){
ICA.base = "../";
var bar = ICA.topbar("Web Lab"), app = document.getElementById("app"), esc = ICA.esc, md = ICA.md;
var LIST = window.WLAB || [], GROUPS = window.WLAB_GROUPS || [], BY = {};
LIST.forEach(function(c, i){ BY[c.id] = c; c.i = i; });
function store(){ var s = ICA.load(); s.labs = s.labs || {}; s.labs.web = s.labs.web || {}; return s.labs.web; }
function setTitle(t){ document.title = t + " · Web Lab"; bar.querySelector(".title").textContent = t; }
var LANG = {html:"HTML", css:"CSS", js:"JavaScript"};

function home(){
  setTitle("Web Lab");
  var st = store(), n = LIST.filter(function(c){ return st[c.id] && st[c.id].done; }).length;
  app.innerHTML = '<div class="stack"><a class="small" href="index.html">← All labs</a><div><div class="eyebrow">Labs</div><h1>Web Lab</h1>'+
    '<p class="lead">Write real HTML, CSS and JavaScript, see the page change as you type, and press Check.</p></div>'+
    ICA.mugi("tip", '<p><b>How checking works:</b> your code runs in a real browser page, and I look at what the page actually shows (the colours, the layout, what happens when the button is clicked), not the exact words you typed. So any correct way of writing it passes.</p><p class="small">If something’s off, you’ll see which line and why.</p>', {small:true})+
    '<p class="small muted">'+n+' of '+LIST.length+' solved. Works on a phone: the symbol keys under the editor save hunting for &lt; &gt; { } and friends.</p>'+
    '<div class="groups">'+GROUPS.map(function(g){
      var cs = LIST.filter(function(c){ return c.group === g.id; });
      return '<section class="grp"><h2>'+esc(g.title)+'</h2><p class="small muted">'+esc(g.blurb)+'</p><div class="chal">'+cs.map(function(c){ var d = st[c.id] && st[c.id].done; return '<a href="#'+c.id+'" class="'+(d ? "done" : "")+'"><span class="n">'+(d ? "✓" : (c.i+1))+'</span><span>'+esc(c.title)+'</span></a>'; }).join("")+'</div></section>';
    }).join("")+'</div></div>';
  window.scrollTo(0, 0);
}

var cur = null, code = {}, pane = "html", hintN = 0, timer = null;
function panes(ch){ var p = []; ["html","css","js"].forEach(function(k){ if ((ch.edit || []).indexOf(k) > -1 || (ch.fixed && ch.fixed[k] != null)) p.push(k); }); return p; }
function challenge(id){
  var ch = BY[id]; if (!ch){ home(); return; }
  cur = ch; hintN = 0;
  var st = store()[id] || {};
  code = {}; (ch.edit || ["html"]).forEach(function(k){ code[k] = st.code && st.code[k] != null ? st.code[k] : (ch.start && ch.start[k] != null ? ch.start[k] : ""); });
  pane = (ch.edit || ["html"])[0];
  setTitle(ch.title);
  var g = GROUPS.filter(function(x){ return x.id === ch.group; })[0] || {};
  app.innerHTML = '<div class="stack"><a class="small" href="#">← All challenges</a>'+
    '<div><div class="eyebrow">'+esc(g.title || "")+' · '+(ch.i+1)+' of '+LIST.length+(st.done ? ' · ✓ solved' : '')+'</div><h1 style="margin-top:4px">'+esc(ch.title)+'</h1></div>'+
    '<div class="prose"><p>'+md(ch.task)+'</p></div>'+
    '<div class="paneTabs" role="group" aria-label="Code panes">'+panes(ch).map(function(k){ var ro = (ch.edit || []).indexOf(k) < 0; return '<button data-pane="'+k+'" aria-pressed="'+(k === pane)+'">'+LANG[k]+(ro ? '<span class="ro">(given)</span>' : '')+'</button>'; }).join("")+'</div>'+
    '<label class="sr-only" for="ed">Code editor</label><textarea id="ed" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>'+
    '<div class="keys" role="group" aria-label="Code symbols">'+["<",">","/","=","\"","{","}",":",";","(",")",".","#","'","$","⇥"].map(function(k){ return '<button type="button" data-k="'+esc(k)+'" aria-label="'+(k === "⇥" ? "Indent" : "Type "+esc(k))+'">'+esc(k)+'</button>'; }).join("")+'</div>'+
    '<div class="previewbox"><div class="bar"><span>Preview</span><span id="pvnote">updates as you type</span></div><iframe id="pv" title="Preview of your page" sandbox="allow-scripts allow-same-origin"></iframe></div>'+
    '<div class="row wrapbtns"><button class="btn primary" id="check">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="show">Show an answer</button><button class="btn" id="reset">Start again</button></div>'+
    '<div id="fb" aria-live="polite"></div>'+
    (ch.lesson ? '<p class="small muted">Learn this in <a href="../quests/index.html#'+esc(ch.lesson)+'">Quests: Making with Code</a>.</p>' : '')+
    '<div class="lessonnav" id="nav"></div></div>';
  window.scrollTo(0, 0);
  showPane(); preview(); nav();
  var ed = document.getElementById("ed");
  ed.addEventListener("input", function(){ if ((cur.edit || []).indexOf(pane) < 0) return; code[pane] = ed.value; saveCode(); clearTimeout(timer); timer = setTimeout(preview, 450); });
  ed.addEventListener("keydown", function(e){ if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); insert("  "); } });
}
function showPane(){
  var ed = document.getElementById("ed"), ch = cur, ro = (ch.edit || []).indexOf(pane) < 0;
  ed.value = ro ? (ch.fixed[pane] || "") : code[pane]; ed.readOnly = ro;
  ed.setAttribute("aria-label", LANG[pane] + (ro ? " (given, read-only)" : " editor"));
  ICA.$$(".paneTabs button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-pane") === pane); });
  ed.style.height = "auto"; ed.style.height = Math.max(200, Math.min(520, ed.scrollHeight + 4)) + "px";
}
function saveCode(){ var st = store(); st[cur.id] = st[cur.id] || {}; st[cur.id].code = Object.assign({}, code); ICA.save(); }
function preview(){ var pv = document.getElementById("pv"); if (!pv) return; var note = document.getElementById("pvnote"); if (note) note.textContent = code.js != null && WebLab.loopRisk(code.js) ? "JavaScript paused: a loop never ends" : "updates as you type"; WebLab.run(pv, cur, code).then(function(){ try { var h = pv.contentDocument.documentElement.scrollHeight; pv.style.height = Math.max(140, Math.min(420, h + 8)) + "px"; } catch (e){} }); }
function insert(t){
  var ed = document.getElementById("ed"); if (ed.readOnly) return;
  var s = ed.selectionStart, e = ed.selectionEnd;
  if (t === "⇥") t = "  ";
  ed.value = ed.value.slice(0, s) + t + ed.value.slice(e); ed.setSelectionRange(s + t.length, s + t.length);
  ed.dispatchEvent(new Event("input"));
}
function gotoLine(p, line){
  pane = p; showPane();
  var ed = document.getElementById("ed"), lines = ed.value.split("\n"), start = 0;
  for (var k = 0; k < line - 1 && k < lines.length; k++) start += lines[k].length + 1;
  ed.focus(); ed.setSelectionRange(start, start + (lines[line - 1] || "").length);
  ed.scrollIntoView({block:"center", behavior:"smooth"});
}
async function check(){
  var btn = document.getElementById("check"); btn.disabled = true; btn.textContent = "Checking…";
  var cf = document.getElementById("checkframe"), ch = cur;
  var res = await WebLab.check(cf, ch, code);
  btn.disabled = false; btn.textContent = "Check";
  var st = store(); st[ch.id] = st[ch.id] || {}; st[ch.id].tries = (st[ch.id].tries || 0) + 1;
  if (res.ok && !st[ch.id].done) st[ch.id].done = Date.now();
  ICA.save();
  var hard = res.lint.filter(function(x){ return !x.soft; }), soft = res.lint.filter(function(x){ return x.soft; });
  var h = '<div class="fb '+(res.ok ? "ok" : "bad")+'">';
  h += '<b class="h">'+(res.ok ? "✓ "+["It works!","Nicely done.","That’s it!","Yes!"][ch.i % 4] : hard.length ? "Some code can’t be read yet" : "Not quite yet")+'</b>';
  if (hard.length || soft.length){
    h += '<div class="lint">'+hard.concat(soft).sort(function(a, b){ return a.pane === b.pane ? a.line - b.line : 0; }).slice(0, 6).map(function(x){ return '<button class="'+(x.soft ? "soft" : "")+'" data-goto="'+x.pane+':'+x.line+'"><b>'+LANG[x.pane]+' · line '+x.line+(x.soft ? ' · tip' : '')+'</b><br>'+esc(x.msg)+'</button>'; }).join("")+'</div>';
    if (hard.length) h += '<p class="small muted">Tap a message to jump to that line. Browsers quietly skip code they can’t read, so fix these first.</p>';
  }
  if (res.errors.length && (ch.edit || []).indexOf("js") > -1){
    h += '<p><b>JavaScript stopped with an error:</b></p><div class="lint">'+res.errors.slice(0, 3).map(function(e){ var ex = WebLab.explainError(e.msg); return '<button data-goto="js:'+(e.line || 1)+'"><b>JavaScript'+(e.line ? ' · line '+e.line : '')+'</b><br><code>'+esc(e.msg)+'</code>'+(ex ? '<br>'+esc(ex) : '')+'</button>'; }).join("")+'</div>';
  }
  h += '<ul>'+res.checks.map(function(c){ return '<li><span aria-hidden="true">'+(c.ok ? "✅" : "⬜")+'</span><span>'+esc(c.t)+(c.ok ? "" : '<span class="sr-only"> (not yet)</span>')+'</span>'+(c.ok ? "" : '<span class="why muted">'+esc(c.msg)+'</span>')+'</li>'; }).join("")+'</ul>';
  if (res.logs.length) h += '<p class="small muted">Console output:</p><div class="console">'+esc(res.logs.slice(-6).join("\n"))+'</div>';
  if (res.ok) h += '<p>'+md(ch.explain || "")+'</p>';
  h += '</div>';
  document.getElementById("fb").innerHTML = h;
  nav();
  document.getElementById("fb").scrollIntoView({block:"nearest", behavior:"smooth"});
}
function nav(){
  var ch = cur, next = LIST[ch.i + 1], el = document.getElementById("nav"), done = (store()[ch.id] || {}).done;
  el.innerHTML = (LIST[ch.i - 1] ? '<a class="btn" href="#'+LIST[ch.i-1].id+'">← Back</a>' : '<span></span>') + (next ? '<a class="btn'+(done ? ' primary' : '')+'" href="#'+next.id+'">'+(done ? "Next challenge →" : "Skip →")+'</a>' : '<a class="btn primary" href="#">All challenges</a>');
}
document.addEventListener("click", function(e){
  var t; if (!cur || !document.getElementById("ed")) return;
  if ((t = e.target.closest("[data-pane]"))){ pane = t.getAttribute("data-pane"); showPane(); return; }
  if ((t = e.target.closest("[data-k]"))){ insert(t.getAttribute("data-k")); document.getElementById("ed").focus({preventScroll:true}); return; }
  if ((t = e.target.closest("[data-goto]"))){ var g = t.getAttribute("data-goto").split(":"); gotoLine(g[0], +g[1]); return; }
  if (e.target.id === "check"){ check(); return; }
  if (e.target.id === "reset"){ (cur.edit || []).forEach(function(k){ code[k] = cur.start && cur.start[k] != null ? cur.start[k] : ""; }); saveCode(); showPane(); preview(); document.getElementById("fb").innerHTML = ""; return; }
  if (e.target.id === "hint"){ var hs = cur.hints || [], i = Math.min(hintN, hs.length - 1); hintN++; document.getElementById("fb").innerHTML = '<div class="fb"><b class="h">Hint '+(i+1)+' of '+hs.length+'</b><p>'+esc(hs[i] || "")+'</p></div>'; return; }
  if (e.target.id === "show"){
    var sol = cur.solution || {};
    document.getElementById("fb").innerHTML = '<div class="fb"><b class="h">One answer</b>'+Object.keys(sol).map(function(k){ return '<figure class="codeblk"><figcaption><span>'+LANG[k]+'</span></figcaption><pre><code>'+esc(sol[k])+'</code></pre></figure>'; }).join("")+'<p>'+md(cur.explain || "")+'</p><p class="small muted">Try typing it in yourself and pressing Check: typing it once helps it stick.</p></div>';
  }
});
function route(){ var id = location.hash.slice(1); if (id && BY[id]) challenge(id); else { cur = null; home(); } }
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
